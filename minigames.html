<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guruhalle MiniGame Center</title>
<meta name="theme-color" content="#0b0907">
<style>
:root{--bg:#0b0907;--panel:#15110d;--panel2:#1d1712;--line:#3a2e20;--txt:#f5eee2;--mut:#b5a690;--org:#f7931a;--gold:#f2b33d;--green:#3ecf8e;--red:#ff5a5a;--blue:#5ab4ff;--purple:#b07cff;--r:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:0 max(12px,env(safe-area-inset-right)) 40px max(12px,env(safe-area-inset-left))}
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.btn.main{background:linear-gradient(180deg,#ffb347,#f7931a);border-color:#ffcf86;color:#1a0e00}
.btn.green{background:linear-gradient(180deg,#5be3a5,#2bb673);border-color:#8ff0c3;color:#03200f}
.btn.red{background:linear-gradient(180deg,#ff7b7b,#e04040);border-color:#ffb0b0;color:#2a0000}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:12px 22px;font-size:17px;border-radius:12px}
.muted{color:var(--mut)}
h1,h2,h3{margin:0}
/* Kopf */
#top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg) 80%,rgba(11,9,7,0));padding:12px 0 10px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo .gp{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle at 35% 30%,#ffc56b,#f7931a 55%,#b85f05);box-shadow:0 0 16px rgba(247,147,26,.4)}
.logo b{display:block;font-size:18px;letter-spacing:.02em}
.logo small{color:var(--mut);font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;font-size:14px}
.pill.c{border-color:#7a5a1c;color:var(--gold)}
.pill.s{color:#ffd166}.pill.p{color:#9fd8ff}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18);box-shadow:0 0 14px rgba(242,179,61,.7)}}
nav.sec{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.sec button{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
nav.sec button.on{background:linear-gradient(180deg,#ffb347,#f7931a);border-color:#ffcf86;color:#1a0e00}
/* Galerie */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);padding:10px 0;font:inherit;min-width:0}
.search:focus-within{border-color:var(--gold)}
select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap;font-size:14px}
.chip.on{border-color:var(--gold);background:#2a1f10;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.gc:hover{transform:translateY(-2px);border-color:#6b5230}
.gc .art{position:relative;height:120px;display:grid;place-items:center;font-size:56px;overflow:hidden;cursor:pointer}
.gc .art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px)}
.gc .art span{position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2}
.bdg{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.55);letter-spacing:.03em}
.bdg.new{background:var(--green);color:#03200f}.bdg.hot{background:var(--red);color:#fff}
.gc .body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.gc h3{font-size:16px}
.gc p{margin:0;color:var(--mut);font-size:13px;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.meta span{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.gc .foot{display:flex;align-items:center;gap:8px;margin-top:4px}
.gc .foot .best{font-size:12px;color:var(--gold);margin-right:auto}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.banner{display:flex;gap:14px;align-items:center;background:linear-gradient(110deg,#2a1a08,#15110d 60%);border:1px solid #5a4020;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;flex-wrap:wrap}
.banner .bi{font-size:40px;flex:none!important;min-width:0!important}
.banner div{flex:1;min-width:200px}
.banner b{color:var(--gold)}
.bar{height:6px;background:#2a2219;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f7931a,#ffd166)}
/* Karten-Panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h2{font-size:14px;letter-spacing:.08em;color:var(--gold);margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
/* Shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.si{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.si.eq{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.si .pv{height:96px;border-radius:9px;display:grid;place-items:center;background:#0f0c09;overflow:hidden}
.si b{font-size:14px}
.si small{font-size:12px;color:var(--mut)}
.rar{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.r1{color:#c9bfae}.r2{color:var(--blue)}.r3{color:var(--purple)}.r4{color:var(--gold)}
.si.r4{background:linear-gradient(160deg,#2b2111,#1d1712 60%)}
.deal{position:absolute;right:8px;top:8px;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;z-index:2}
.cardback{width:58px;height:82px;border-radius:7px;border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.felt{width:120px;height:70px;border-radius:40px;border:5px solid #5a3b1c;box-shadow:inset 0 0 18px rgba(0,0,0,.6)}
.frame{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#2a2219}
.ttl{font-weight:800;padding:5px 10px;border-radius:8px;background:#2a2219;font-size:14px}
/* Wechselstube */
.xrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.xrow input[type=range]{flex:1;min-width:140px;accent-color:var(--org)}
.rate{font-variant-numeric:tabular-nums;font-weight:700}
.up{color:var(--green)}.dn{color:var(--red)}
.log{max-height:260px;overflow:auto;font-size:13px}
.log div{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #241c14}
.log div span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.howto li{margin:4px 0}
code{background:#241c14;border-radius:5px;padding:1px 5px;font-size:12.5px}
/* Spielansicht */
#play{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#play[hidden]{display:none}
.phead{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel)}
.phead .t{font-weight:800;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.phead .t small{font-weight:600;color:var(--gold);margin-left:8px}
#stage{flex:1;position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:14px max(10px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#stage .gm{width:100%;max-width:760px;margin:0 auto}
.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.hud span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.rowc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.msg{min-height:26px;font-weight:700;text-align:center}
.over{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,9,7,.78);z-index:30;padding:16px;animation:tin2 .25s}@keyframes tin2{from{opacity:0}}
.over .box{background:var(--panel);border:1px solid #6b5230;border-radius:16px;padding:20px 22px;text-align:center;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.over h2{font-size:24px;margin-bottom:6px}
.over .gain{font-size:22px;color:var(--gold);font-weight:800;margin:8px 0 14px}
/* Spielkarten */
.pc{width:72px;height:104px;border-radius:9px;background:#fbf7ee;color:#1b1b1b;display:flex;flex-direction:column;justify-content:space-between;padding:5px 7px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.45);position:relative;flex:none;user-select:none}
.pc.red{color:#d42a2a}
.pc .c{font-size:30px;align-self:center;line-height:1}
.pc .r{font-size:18px;line-height:1}
.pc .rb{transform:rotate(180deg)}
.pc.big{width:110px;height:158px;border-radius:12px;padding:8px 10px}
.pc.big .c{font-size:52px}.pc.big .r{font-size:26px}
.pc.sm{width:46px;height:66px;padding:3px 5px;border-radius:6px}
.pc.sm .c{font-size:19px}.pc.sm .r{font-size:13px}
.pc.back{background:var(--cb,#7a1f1f);border:3px solid #fbf7ee}
.pc.deal{animation:dealIn .3s ease-out}
@keyframes dealIn{from{transform:translateY(-30px) rotate(-8deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#241a0e;border:1px solid var(--gold);color:var(--txt);padding:9px 16px;border-radius:12px;z-index:50;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.6);max-width:92vw;text-align:center;animation:tin .25s}
@keyframes tin{from{transform:translate(-50%,20px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:440px;width:100%;max-height:85vh;overflow:auto}
canvas{touch-action:none;display:block}
/* ---------- Mehrspieler (Lobby, Räume, Spielansicht) – Bausteine siehe MULTIPLAYER.md ---------- */
.bdg.onl{background:#1d4f7a;color:#d9efff}
.chip.onl{border-color:#2f6a9b;color:#9fd8ff}.chip.onl.on{background:#12324d;border-color:var(--blue);color:#fff}
nav.sec .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--green);color:#03200f;font-size:11.5px;font-weight:800;margin-left:3px}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:#2a2219;color:var(--mut);white-space:nowrap}
.tag.gold{background:#3a2a0e;color:var(--gold)}.tag.ok{background:#0f3323;color:var(--green)}.tag.wait{background:#2a2219;color:#8a7c68}
.mp-wrap{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.mp-title{display:flex;gap:14px;align-items:center}.mp-title h2{font-size:22px}.mp-title.sm h2{font-size:18px}
.mp-ic{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:34px;background:var(--panel2);border:1px solid var(--line);flex:none}
.mp-title.sm .mp-ic{width:42px;height:42px;font-size:24px}
.mp-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mp-mode{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;cursor:pointer;display:grid;grid-template-columns:40px 1fr;gap:2px 10px;align-items:center;color:var(--txt)}
.mp-mode span{grid-row:span 2;font-size:30px}.mp-mode small{color:var(--mut);font-size:12.5px}
.mp-mode:hover{border-color:var(--gold)}.mp-mode.hi{border-color:#7a5a1c;background:linear-gradient(120deg,#2a1a08,#15110d)}
.mp-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.mp-card h3{font-size:13px;letter-spacing:.07em;color:var(--gold);margin-bottom:8px;text-transform:uppercase}
.mp-card h3 small{text-transform:none;letter-spacing:0;font-weight:500}
.mp-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #241c14;font-size:14px}
.mp-opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--org)}.mp-opt select{padding:6px 8px}
.mp-hint{font-size:12.5px;margin-top:4px}
.mp-plist{display:flex;flex-direction:column;gap:5px}
.mp-p{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:10px;background:var(--panel2);border:1px solid transparent;min-width:0}
.mp-p b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto;min-width:0}
.mp-p.me{border-color:#6b5230}.mp-p.bot{opacity:.8}
.mp-p .av,.mp-seat .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:#3a2e20;color:#1a0e00;flex:none}
.mp-p input{flex:1;min-width:0;background:#0f0c09;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 8px;font:inherit}
.mp-lnames{display:flex;flex-direction:column;gap:5px;margin:8px 0}
.mp-namefld{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-top:10px}
.mp-namefld input{flex:1;min-width:0;max-width:240px;background:#0f0c09;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 10px;font:inherit}
.mp-actions{margin-top:4px}
.mp-spin{width:34px;height:34px;border-radius:50%;border:4px solid #3a2e20;border-top-color:var(--org);animation:spin 1s linear infinite;flex:none!important;min-width:0!important}@keyframes spin{to{transform:rotate(360deg)}}
.mp-strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;background:#10202e;border:1px solid #2f6a9b;border-radius:12px;padding:8px 10px;margin:0 auto 12px;max-width:760px}
.mp-codein{font:800 30px/1 ui-monospace,Menlo,monospace;letter-spacing:.25em;text-transform:uppercase;text-align:center;width:100%;max-width:240px;background:#0f0c09;border:1px solid var(--line);color:var(--gold);border-radius:12px;padding:10px}
.mp-chatrow{display:flex;gap:6px;margin-top:6px}.mp-chatrow input{flex:1;min-width:0;background:#0f0c09;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 10px;font:inherit}
.mp-chatrow.mini{margin:0;flex:1;max-width:320px}.mp-chatrow.mini input{padding:4px 8px;font-size:13px}
.mp-chatlog{max-height:150px;min-height:60px;overflow:auto;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
/* Spielansicht */
.mp-play{width:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:6px;min-height:calc(100vh - 92px);min-height:calc(100dvh - 92px)}
.mp-bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;justify-content:center;flex-wrap:wrap}
.mp-play.nobar .mp-bar{display:none}
.mp-seat{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 10px 4px 5px;transition:box-shadow .2s,border-color .2s}
.mp-seat .av{background:var(--sc)}.mp-seat .nm{display:flex;flex-direction:column;line-height:1.1}.mp-seat .nm b{font-size:13.5px}.mp-seat .nm small{font-size:11px;color:var(--mut)}
.mp-seat.on{border-color:var(--sc);box-shadow:0 0 0 2px var(--sc),0 0 16px var(--sc)}.mp-seat.me .nm b{color:var(--gold)}.mp-seat.gone{opacity:.55}
.mp-timer{height:4px;border-radius:3px;background:#241c14;overflow:hidden;visibility:hidden}.mp-timer i{display:block;height:100%;width:100%;background:#6b5230;transition:width .2s linear}
.mp-timer.mine i{background:var(--org)}.mp-timer.low i{background:var(--red)}
.mp-stage{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-height:0}
.mp-foot{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;padding-top:4px}
.mp-pass{position:absolute;inset:0;background:rgba(11,9,7,.97);display:grid;place-items:center;text-align:center;z-index:25;border-radius:14px;padding:16px}
.mp-end .box{max-width:400px}
.mp-rank{display:flex;flex-direction:column;gap:4px;margin:12px 0 4px;text-align:left}
.mp-rank div{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:9px;padding:5px 10px}.mp-rank div.me{outline:1px solid var(--gold);color:var(--gold)}
.mp-rank b{margin-right:auto}
/* Lobby „Zusammen spielen“ */
.rm{display:flex;flex-direction:column;gap:12px}
.rm-head{margin-bottom:0}.rm-head.bad{border-color:#7a2a2a;background:linear-gradient(110deg,#2a0d0d,#15110d 60%)}
.rm-note{margin-top:6px;font-size:13px;color:#ffd166;font-weight:600}
.rm-code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--gold)}
.rm-cols{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2fr);gap:12px}
.rm-cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.rm-glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:10px}
.rm-g{appearance:none;position:relative;border:1px solid var(--line);border-radius:12px;padding:8px 6px;cursor:pointer;color:var(--txt);background:linear-gradient(140deg,var(--g1),var(--g2));display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.rm-g .i{font-size:28px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}.rm-g b{font-size:13px;line-height:1.1}.rm-g small{font-size:11px;opacity:.85}
.rm-g.on{outline:3px solid var(--gold);outline-offset:1px}.rm-g:hover{border-color:var(--gold)}
.rm-g .vt{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.6);border-radius:6px;font-size:11px;padding:0 5px;font-weight:800}
.rm-sel{display:flex;gap:12px;align-items:center}.rm-sel .i{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:32px;flex:none}
.rm-set{margin-top:8px}
.rm-go{margin-top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.rm-linkrow{display:flex;gap:6px;margin-bottom:8px}.rm-linkrow input{flex:1;min-width:0;background:#0f0c09;border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:6px 9px;font:inherit;font-size:12.5px}
@media (max-width:760px){.rm-cols{grid-template-columns:1fr}}
@media (max-width:560px){
  .mp-mode{padding:11px}.mp-seat .nm small{display:none}.mp-seat{padding:3px 8px 3px 4px}.rm-glist{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mp-play{min-height:calc(100vh - 80px);min-height:calc(100dvh - 80px)}

  #top{position:static}

var GuruCore = (function () {
  var DAY_CAP = 600;                               // max. 🪙 pro Tag aus MiniGames
  var CRED_CAP = { sats: 1000, chips: 50000 };     // max. ⚡/♠ pro Tag aus Kart/Poker (je ≈ 500 🪙)
  var CRED_MSG = { sats: 500, chips: 100000 };     // max. pro einzelner Gutschrift
  var REWARD_MAX = 200;                            // max. 🪙 pro einzelner Belohnung
  var LOW_GAMES = { memory: true };                // Rekord = kleinster Wert
  var BASE = { sats: 0.5, chips: 0.01 };           // 2 ⚡ = 1 🪙 · 100 ♠ = 1 🪙 (Grundkurs, täglich ±15 %)
  // [id, Platz, Name, Preis, Seltenheit, Währung (Standard 🪙 'coins'; 'sats' = ⚡ aus dem Kart)]
  var SKIN_DATA = [
    ['k_orange', 'kart', 'Orange Pill', 120, 1], ['k_laser', 'kart', 'Laser Eyes', 260, 2], ['k_diamond', 'kart', 'Diamond Hands', 480, 3],
    ['k_bear', 'kart', 'Bärenmarkt', 200, 2], ['k_lambo', 'kart', 'Wen Lambo (Gold)', 900, 4], ['k_moon', 'kart', 'Moon-Chrome', 650, 3],
    ['b_green', 'boost', 'Grüne Kerze', 150, 2], ['b_plasma', 'boost', 'Lila Plasma', 320, 3], ['b_rainbow', 'boost', 'Bullrun-Regenbogen', 700, 4],
    ['c_classic', 'cards', 'Stammtisch Klassik', 80, 1], ['c_btc', 'cards', 'Bitcoin-Netz', 220, 2], ['c_candle', 'cards', 'Candlestick', 300, 3], ['c_gold', 'cards', 'Guru-Gold', 800, 4],
    ['f_green', 'felt', 'Grün Klassik', 100, 1], ['f_red', 'felt', 'Bärenrot', 240, 2], ['f_night', 'felt', 'Mitternachts-Chart', 380, 3], ['f_orange', 'felt', 'Orange Pill Lounge', 750, 4],
    ['fr_bull', 'frame', 'Bullen-Rahmen', 150, 2], ['fr_whale', 'frame', 'Wal-Rahmen', 420, 3], ['fr_rocket', 'frame', 'To-the-Moon-Rahmen', 850, 4],
    ['k_fbull', 'formel', 'Bull Market', 250, 3, 'sats'], ['k_fbear', 'formel', 'Bear Market', 250, 3, 'sats'], // v32: Pfeffis Formel-Renner – gekauft in der Kart-Lobby mit ⚡ (nicht im Shop)
    ['t_paper', 'title', '„Paperhands“', 30, 1], ['t_hodl', 'title', '„HODLer“', 120, 2], ['t_guru', 'title', '„Chart-Guru“', 400, 3], ['t_satoshi', 'title', '„Satoshis Erbe“', 1500, 4],
  ];
  var SKIN_BY = {};
  SKIN_DATA.forEach(function (s) { SKIN_BY[s[0]] = { id: s[0], slot: s[1], name: s[2], price: s[3], rar: s[4], cur: s[5] || 'coins' }; });
  var DEAL_SKINS = SKIN_DATA.filter(function (s) { return !s[5]; }); // Tagesangebot nur bei 🪙-Skins

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hashStr(s) { var x = 2166136261; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }

  function rate(cur, date) { return BASE[cur] * (0.85 + seeded(hashStr(cur + today(date)))() * 0.3); }
  function dailyDeal(date) { return DEAL_SKINS[Math.floor(seeded(hashStr('deal' + today(date)))() * DEAL_SKINS.length)][0]; }
  function priceOf(id, date) { var s = SKIN_BY[id]; if (!s) return null; return id === dailyDeal(date) ? Math.round(s.price * 0.7) : s.price; }
  function num(x) { x = Math.round(Number(x)); return isFinite(x) ? x : 0; }
  function txt(s, n) { return String(s == null ? '' : s).replace(/[<>]/g, '').slice(0, n || 60); }
  function gid(g) { g = String(g || ''); return /^[a-z0-9_]{2,20}$/.test(g) ? g : ''; }

  function blank(now) {
    now = now || Date.now();
    return { v: 1, coins: 100, sats: 0, chips: 0, owned: {}, equip: {}, log: [{ t: now, cur: 'coins', n: 100, why: 'Willkommensbonus 🎁' }],
      day: today(new Date(now)), dayEarn: 0, dayCred: { sats: 0, chips: 0 }, bet: 0, hs: {}, plays: {}, stats: { games: 0, earned: 100 }, spin: '', seen: [] };
  }
  // fehlende Felder ergänzen, Tageszähler um Mitternacht zurücksetzen
  function normalize(d, now) {
    now = now || Date.now();
    var b = blank(now);
    if (!d || typeof d !== 'object' || d.v !== 1) return b;
    for (var k in b) if (d[k] === undefined || d[k] === null) d[k] = b[k];
    var t = today(new Date(now));
    if (d.day !== t) { d.day = t; d.dayEarn = 0; d.dayCred = { sats: 0, chips: 0 }; d.bet = 0; }
    return d;
  }
  function log(d, cur, n, why, now) { d.log.unshift({ t: now, cur: cur, n: n, why: txt(why) }); if (d.log.length > 40) d.log.length = 40; }

  // Eine Operation anwenden. Rückgabe {ok, err?, got?}. Jede Operation hat eine id → doppelt gesendete zählen nur einmal.
  function applyOp(d, op, now) {
    now = now || Date.now();
    if (!op || typeof op !== 'object') return { ok: false, err: 'kaputt' };
    normalize(d, now);
    if (op.id && d.seen.indexOf(op.id) >= 0) return { ok: true, dup: true };
    var r = apply_(d, op, now, new Date(now));
    if (r.ok && op.id) { d.seen.push(String(op.id).slice(0, 24)); if (d.seen.length > 150) d.seen.splice(0, d.seen.length - 150); }
    return r;
  }
  function apply_(d, op, now, date) {
    var n = num(op.n), g = gid(op.g);
    switch (op.op) {
      case 'reward': { // MiniGame-Gewinn
        n = Math.max(0, Math.min(REWARD_MAX, n));
        var got = Math.min(n, Math.max(0, DAY_CAP - d.dayEarn));
        if (!n) return { ok: true, got: 0 };
        if (!got) return { ok: true, got: 0, err: 'limit' };
        d.coins += got; d.dayEarn += got; d.stats.earned += got; log(d, 'coins', got, op.why, now);
        return { ok: true, got: got };
      }
      case 'spend': { // Coins ausgeben (Einsatz, Glücksrad); bet: 'new' | 'add' merkt den offenen Einsatz
        if (n <= 0 || d.coins < n) return { ok: false, err: 'zu wenig' };
        d.coins -= n; log(d, 'coins', -n, op.why, now);
        if (op.bet === 'new') d.bet = n; else if (op.bet === 'add') d.bet += n;
        return { ok: true };
      }
      case 'refund': { // Einsatz zurück – höchstens der offene Einsatz
        n = Math.max(0, Math.min(n, d.bet)); d.bet = 0;
        if (n) { d.coins += n; log(d, 'coins', n, op.why || 'Einsatz zurück', now); }
        return { ok: true, got: n };
      }
      case 'credit': { // ⚡ aus dem Kart / ♠ aus dem Poker
        var cur = op.cur; if (!CRED_CAP[cur]) return { ok: false, err: 'währung' };
        n = Math.max(0, Math.min(CRED_MSG[cur], n));
        var c = Math.min(n, Math.max(0, CRED_CAP[cur] - (d.dayCred[cur] || 0)));
        if (!c) return { ok: true, got: 0, err: n ? 'limit' : undefined };
        d[cur] += c; d.dayCred[cur] = (d.dayCred[cur] || 0) + c; log(d, cur, c, op.why || 'Gutschrift', now);
        return { ok: true, got: c };
      }
      case 'exchange': {
        var cu = op.cur; if (!BASE[cu]) return { ok: false, err: 'währung' };
        n = Math.min(n, d[cu]); var rt = rate(cu, date), out = Math.floor(n * rt);
        if (n <= 0 || out <= 0) return { ok: false, err: 'zu wenig' };
        var used = Math.min(n, Math.ceil(out / rt - 1e-9));
        d[cu] -= used; d.coins += out;
        log(d, cu, -used, 'Getauscht in ' + out + ' 🪙', now); log(d, 'coins', out, 'Wechselstube', now);
        return { ok: true, got: out };
      }
      case 'buy': {
        var s = SKIN_BY[op.sid]; if (!s) return { ok: false, err: 'unbekannt' };
        if (d.owned[s.id]) return { ok: false, err: 'schon da' };
        var p = priceOf(s.id, date), sc = s.cur; if (!(d[sc] >= p)) return { ok: false, err: 'zu wenig' };
        d[sc] -= p; d.owned[s.id] = now; d.equip[s.slot] = s.id; log(d, sc, -p, 'Skin: ' + s.name, now);
        return { ok: true };
      }
      case 'equip': {
        var slot = String(op.slot || '');
        if (!op.sid) { delete d.equip[slot]; return { ok: true }; }
        var sk = SKIN_BY[op.sid]; if (!sk || !d.owned[sk.id] || sk.slot !== slot) return { ok: false, err: 'nicht deins' };
        d.equip[slot] = sk.id; return { ok: true };
      }
      case 'score': {
        var v = Number(op.v); if (!g || !isFinite(v) || v < 0 || v > 1e7) return { ok: false, err: 'wert' };
        var cur2 = d.hs[g], better = cur2 === undefined || (LOW_GAMES[g] ? v < cur2 : v > cur2);
        if (better) d.hs[g] = v;
        return { ok: true, better: better };
      }
      case 'played': { if (!g) return { ok: false, err: 'spiel' }; d.plays[g] = (d.plays[g] || 0) + 1; d.stats.games++; return { ok: true }; }
      case 'spin': { var t = today(date); if (d.spin === t) return { ok: false, err: 'schon gedreht' }; d.spin = t; return { ok: true }; }
      case 'wipe': { var seen = d.seen, nb = blank(now); for (var k in d) delete d[k]; for (var k2 in nb) d[k2] = nb[k2]; d.seen = seen; return { ok: true }; }
    }
    return { ok: false, err: 'unbekannte Operation' };
  }
  // Gast-Fortschritt beim Registrieren übernehmen (gedeckelt – der Browser-Speicher ist nicht vertrauenswürdig)
  function importGuest(d, g, now) {
    if (!g || typeof g !== 'object') return d;
    d.coins = Math.max(d.coins, Math.min(1500, Math.max(0, num(g.coins))));
    d.sats = Math.min(1500, Math.max(0, num(g.sats))); d.chips = Math.min(150000, Math.max(0, num(g.chips)));
    if (g.owned && typeof g.owned === 'object') for (var id in g.owned) if (SKIN_BY[id]) d.owned[id] = now;
    if (g.equip && typeof g.equip === 'object') for (var sl in g.equip) { var s = SKIN_BY[g.equip[sl]]; if (s && s.slot === sl && d.owned[s.id]) d.equip[sl] = s.id; }

    log(d, 'coins', 0, 'Gast-Fortschritt übernommen', now);
    return d;
  }
  return { DAY_CAP: DAY_CAP, CRED_CAP: CRED_CAP, LOW_GAMES: LOW_GAMES, SKIN_DATA: SKIN_DATA, SKIN_BY: SKIN_BY,
    today: today, hashStr: hashStr, seeded: seeded, rate: rate, dailyDeal: dailyDeal, priceOf: priceOf,
    blank: blank, normalize: normalize, applyOp: applyOp, importGuest: importGuest };
})();

'use strict';
// ================================================================
// Guruhalle MiniGame Center – Kern

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

const fmt = (n) => Math.round(n || 0).toLocaleString('de-DE');
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const hashStr = GuruCore.hashStr, seeded = GuruCore.seeded;
function toast(msg, ms = 2600) {

  setTimeout(() => t.remove(), ms);
}
function playerName() {
  try {
    for (const k of ['gk.name', 'pokerabend.name']) { const v = JSON.parse(localStorage.getItem(k) || 'null'); if (v && typeof v === 'string') return v; }
  } catch (e) { /* egal */ }
  return 'Gast';
}

// ---------- Sound (kleine Web-Audio-Töne, kein Download) ----------
const Sound = {
  ctx: null, on: true,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; } } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d = 0.08, type = 'square', vol = 0.06, slide = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  },
  fx(k) {
    const T = (f, d, ty, v, s, w = 0) => setTimeout(() => this.tone(f, d, ty, v, s), w);
    switch (k) {
      case 'click': T(660, 0.04, 'square', 0.03); break;
      case 'flip': T(900, 0.05, 'triangle', 0.05, -300); break;
      case 'good': T(660, 0.08, 'triangle', 0.07); T(990, 0.12, 'triangle', 0.07, 0, 70); break;
      case 'bad': T(220, 0.2, 'sawtooth', 0.05, -120); break;
      case 'coin': T(1320, 0.06, 'square', 0.04); T(1760, 0.1, 'square', 0.04, 0, 60); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => T(f, 0.14, 'triangle', 0.07, 0, i * 90)); break;
      case 'lose': [392, 330, 262].forEach((f, i) => T(f, 0.18, 'sawtooth', 0.04, 0, i * 120)); break;
      case 'dice': for (let i = 0; i < 5; i++) T(300 + Math.random() * 500, 0.03, 'square', 0.03, 0, i * 35); break;
      case 'tick': T(1200, 0.02, 'square', 0.02); break;
      case 'drop': T(500, 0.1, 'triangle', 0.06, -250); break;
    }
  },
};
window.addEventListener('pointerdown', () => Sound.init(), { once: true });

  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },

  blank: () => GuruCore.blank(),
  load() { this.d = GuruCore.normalize(ls.get(WKEY, null)); return this.d; },

// API für ein laufendes Spiel. Alles, was hierüber angemeldet wird, räumt close() wieder ab.
function makeApi(g, root, hooks) {
  const cleans = [];

  const api = {
    root, game: g, name: playerName(),
    get alive() { return alive; },
    // Belohnung: Coins gutschreiben (Tageslimit) – zeigt Toast + Animation
    reward(n, why) { const got = Wallet.earn(n, why || g.title); if (got) { Sound.fx('coin'); hooks.bump(); } return got; },
    spend(n, why, bet) { const ok = Wallet.spend('coins', n, why || g.title, bet); if (ok) hooks.bump(); return ok; },
    // Einsatz zurückgeben (zählt nicht zum Tageslimit) – z. B. bei Unentschieden oder als Teil eines Gewinns
    refund(n, why) { const got = Wallet.op({ op: 'refund', n: Math.round(n), why: why || 'Einsatz zurück' }).got || 0; if (got) hooks.bump(); return got; },
    coins() { return Wallet.d.coins; },
    // Highscore melden → true, wenn neuer Rekord
    score(v) { const r = Wallet.op({ op: 'score', g: g.id, v }); if (r.better) hooks.title(); return !!r.better; },
    best() { return Wallet.d.hs[g.id]; },
    played() { Wallet.op({ op: 'played', g: g.id }); },
    sfx: (k) => Sound.fx(k), toast,
    timeout(f, ms) { const id = setTimeout(() => alive && f(), ms); cleans.push(() => clearTimeout(id)); return id; },
    interval(f, ms) { const id = setInterval(() => alive && f(), ms); cleans.push(() => clearInterval(id)); return id; },
    raf(f) { let id = 0, last = performance.now(); const loop = (t) => { if (!alive) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; if (f(dt, t) !== false) id = requestAnimationFrame(loop); }; id = requestAnimationFrame(loop); cleans.push(() => cancelAnimationFrame(id)); },
    on(target, ev, f, opt) { target.addEventListener(ev, f, opt); cleans.push(() => target.removeEventListener(ev, f, opt)); },
    onClose(f) { cleans.push(f); },
    // Ergebnis-Overlay: {title, text, coins, again: true}
    finish(o = {}) {
      const box = h(`<div class="over"><div class="box"><h2>${o.title || 'Fertig!'}</h2><div class="muted">${o.text || ''}</div>

    },
    // Canvas mit fester logischer Größe (W×H), passt sich der Bühne an, scharf auf Retina
    canvas(W, H, host) {
      const cv = document.createElement('canvas'), g = cv.getContext('2d');
      const fit = () => {

        cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); g.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);

// ================================================================
// MPCore – Mehrspieler-Logik OHNE DOM (läuft im Browser und in Node)
// Host-Engine für rundenbasierte und Echtzeit-Spiele, Zufall mit Seed,
// Platzierungen, zentrale Coin-Regeln (mpReward) und eine Simulation
// für Tests (alle Plätze Bots). Beschreibung der Schnittstelle: MULTIPLAYER.md
// ================================================================
var MPCore = (function () {
  // ---------- Zufall mit Seed: r() → [0,1), r.int(a,b), r.pick(arr), r.shuffle(arr) ----------
  function rng(seed) {
    var s = (seed >>> 0) || 1;
    var r = function () { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    r.int = function (a, b) { return a + Math.floor(r() * (b - a + 1)); };
    r.pick = function (a) { return a[Math.floor(r() * a.length)]; };
    r.shuffle = function (a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; };
    r.seed = function () { return s; };
    return r;
  }
  function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
  function turnOf(mp, st) { var t = mp.turn ? mp.turn(st) : null; return t == null ? [] : Array.isArray(t) ? t.slice() : [t]; }

  // ---------- Platzierungen ----------
  // ranks[p] = Platz (1 = bester, Gleichstand = gleicher Platz)
  function ranksFromWinners(n, winners) {
    var w = winners || [], out = [];
    for (var i = 0; i < n; i++) out.push(w.indexOf(i) >= 0 ? 1 : 2);
    return out;
  }
  function ranksFromScores(scores, low) {
    return scores.map(function (v) { var better = 0; scores.forEach(function (o) { if (low ? o < v : o > v) better++; }); return better + 1; });
  }
  // over()-Ergebnis vereinheitlichen → {ranks, text, draw}
  function normOver(o, n) {
    if (!o) return null;
    var ranks = o.ranks ? o.ranks.slice(0, n) : ranksFromWinners(n, o.winners || []);
    while (ranks.length < n) ranks.push(n);
    var draw = !!o.draw || (n > 1 && ranks.every(function (r) { return r === 1; }));
    return { ranks: ranks, text: o.text || '', draw: draw };
  }

  // ---------- Coins (alle MP-Spiele zahlen gleich – Tagesdeckel macht GuruCore/Server) ----------
  // result: normOver-Ergebnis · me: eigener Platz-Index · hadHumans: mind. 1 anderer Mensch am Tisch (online)
  // def.mp.coins (optional): {win: 25..40} – Grundwert für einen Sieg gegen Menschen (Standard 30)

// ================================================================
// MPPlay – eine laufende Runde auf dem Bildschirm (für Host, Client, Zuschauer, offline)
//   o: {g, root, me, mode:'online'|'bots'|'local', seats:[{name,bot,local,gone}], isHost, code,
//       send(a)→{error?}, input(i, seat), endButtons(res)→[[id,label,main]], onEnd(id), chat(text)?, ping()?}
// ================================================================
class MPPlay {
  constructor(o) {
    this.o = o; this.g = o.g; this.mp = o.g.mp; this.me = o.me; this.e = null; this.views = []; this.snaps = []; this.endSeq = -1; this.shownFor = -1; this.dead = false; this.lastTick = 0;
    const mp = this.mp, on = o.mode === 'online';
    o.root.innerHTML = `<div class="mp-play${mp.bar === false ? ' nobar' : ''}"><div class="mp-bar"></div><div class="mp-timer"><i></i></div><div class="mp-stage"></div>
      <div class="mp-foot">${on ? `<span class="muted mp-net">${o.code === STAMMTISCH || /^stammtisch/.test(o.code) ? '🍺 Stammtisch' : '🔒 Raum ' + esc(String(o.code).toUpperCase())}</span><form class="mp-chatrow mini"><input maxlength="120" placeholder="💬 Nachricht …" aria-label="Chat"><button class="btn sm" type="submit">↵</button></form>` : `<span class="muted">${o.mode === 'local' ? '👥 Am selben Gerät – nur Ruhm, keine Coins' : '🤖 Gegen Bots – online gibt es mehr 🪙'}</span>`}${this.me < 0 && on ? '<span class="tag">👀 Zuschauer</span>' : ''}</div></div>`;
    this.el = { bar: $('.mp-bar', o.root), timer: $('.mp-timer', o.root), stage: $('.mp-stage', o.root), foot: $('.mp-foot', o.root) };
    const f = $('.mp-chatrow', o.root); if (f) f.onsubmit = (ev) => { ev.preventDefault(); const i = $('input', f); if (o.chat) o.chat(i.value); i.value = ''; i.blur(); };
    const capi = this.capi = makeApi(this.g, this.el.stage, UI.hooks(this.g));
    const self = this;
    // Tisch-Skin (Stapel, Filz, gemeinsame Karten): online der des Hosts, offline der eigene
    this.tsk = cleanSkins(o.tableSkin || (on ? null : mySkins()));
    this.skinOf = (p) => { const s = o.seats[p]; if (!s || s.bot) return this.tsk; const k = s.sk ? cleanSkins(s.sk) : (on ? {} : mySkins()); return Object.assign({}, this.tsk, k.cards ? { cards: k.cards } : {}, k.felt ? { felt: k.felt } : {}, k.frame ? { frame: k.frame } : {}, k.title ? { title: k.title } : {}); };
    let lastIn = '', lastInT = 0, inTimer = 0;
    const api = this.api = Object.create(capi);
    // Getter mit defineProperties (Object.assign würde sie einmalig auswerten → nicht live, v. a. am selben Gerät)
    Object.defineProperties(api, {
      me: { get: () => self.me, enumerable: true },
      spectator: { get: () => self.me < 0, enumerable: true },
      players: { get: () => { const b = (self.e && self.e.bots) || []; return o.seats.map((s, i) => ({ name: s.name, bot: !!(s.bot || b[i]), me: i === self.me, local: !!s.local, color: SEAT_COL[i % 8], gone: !!s.gone, skin: self.skinOf(i) })); }, enumerable: true },
      view: { get: () => self.e && self.e.view, enumerable: true },
      info: { get: () => self.e, enumerable: true },
      over: { get: () => self.e && self.e.over, enumerable: true },
      turnTime: { get: () => (o.turnTime != null ? o.turnTime : MPCore.turnTimeOf(self.mp, {})), enumerable: true },
    });
    Object.assign(api, {
      mode: o.mode, isHost: !!o.isHost, code: o.code || '',
      color: (p) => SEAT_COL[p % 8],
      name: (p) => (o.seats[p] ? o.seats[p].name : '?'),
      // Skins: ohne Platz = Tisch (Skin des Hosts, offline der eigene); mit Platz = Skin dieses Spielers (Bots → Tisch)
      cardBack: (p) => backOf(p == null ? self.tsk : self.skinOf(p)),
      felt: () => feltOf(self.tsk),
      skin: (p) => (p == null ? self.tsk : self.skinOf(p)),
      cardHtml: (c, cls = '', p) => (c ? capi.cardHtml(c, cls) : `<div class="pc back ${cls}" style="--cb:${backOf(p == null ? self.tsk : self.skinOf(p))}"></div>`),
      isMyTurn() { const v = self.e; return !!(v && self.me >= 0 && !v.over && !v.pausing && v.turn.indexOf(self.me) >= 0); },
      timeLeft() { const v = self.e; return v && v.left != null ? Math.max(0, v.left - (Date.now() - v._at)) : null; },
      ping: () => (o.ping ? o.ping() : 0),
      send(a) {
        if (self.me < 0) return { error: 'Du schaust nur zu.' };
        const r = o.send(a, self.me) || {};
        if (r.error) { toast('⛔ ' + esc(r.error)); Sound.fx('bad'); }
        return r;
      },
      onView(fn) { self.views.push(fn); if (self.e) try { fn(self.e.view, self.e); } catch (e) { console.error(e); } },
      // Echtzeit: Eingabe schicken (nur bei Änderung, max. ~30/s); seat nur am selben Gerät
      input(i, seat) {
        if (self.me < 0 && seat == null) return;
        if (o.mode !== 'online' || o.isHost) { o.input(i, seat != null ? seat : self.me); return; }
        const j = JSON.stringify(i), t = performance.now();
        if (j === lastIn && t - lastInT < 400) return;
        clearTimeout(inTimer);
        const go = () => { lastIn = j; lastInT = performance.now(); o.input(i); };
        if (t - lastInT >= 33) go(); else inTimer = setTimeout(go, 33 - (t - lastInT));
      },
      // Echtzeit: zwei Schnappschüsse + Anteil t zum Interpolieren → {a, b, t, over} (a/b = view)
      frame() {
        const S = self.snaps; if (!S.length) return null;
        const per = 1000 / (self.mp.snapHz || 20), delay = o.mode === 'online' && !o.isHost ? per * 1.6 : per, rt = performance.now() - delay;
        let a = S[S.length - 1], b = a;
        for (let i = S.length - 1; i > 0; i--) if (S[i - 1].t <= rt) { a = S[i - 1]; b = S[i]; break; }
        const t = b.t > a.t ? clamp((rt - a.t) / (b.t - a.t), 0, 1) : 1;
        return { a: a.e.view, b: b.e.view, t, over: b.e.over };
      },
      lerp: MPCore.lerp,
    });
    try { if (mp.mount) mp.mount(this.el.stage, api); } catch (e) { console.error(e); this.el.stage.innerHTML = `<div class="empty">Das Spiel ist abgestürzt 😵 (${esc(e.message)})</div>`; }
    this.tm = setInterval(() => this.tick(), 200);
    this.bar();
  }
  setSeats(seats) { this.o.seats = seats; this.bar(); }
  update(e) {
    if (this.dead || !e) return;
    e._at = Date.now();
    if (e.me !== undefined && e.me !== this.me && this.o.mode === 'local') this.me = e.me;
    this.e = e;
    if (this.mp.realtime) { this.snaps.push({ e, t: performance.now() }); if (this.snaps.length > 12) this.snaps.shift(); }
    // am selben Gerät mit verdeckten Infos: Gerät weitergeben
    if (this.o.mode === 'local' && this.mp.hidden && !e.over && this.o.seats.filter((s) => s.local).length > 1 && this.shownFor !== this.me && e.turn.indexOf(this.me) >= 0) this.handOver();
    for (const f of this.views) try { f(e.view, e); } catch (er) { console.error(er); }
    this.bar();
    if (e.over && this.endSeq !== e.seq) { this.endSeq = e.seq; this.end(e.over); }
  }
  handOver() {
    if ($('.mp-pass', this.o.root)) return;
    const p = this.me, nm = this.o.seats[p].name;
    const box = h(`<div class="mp-pass"><div><div style="font-size:46px">📱</div><h2>${esc(nm)} ist dran</h2><p class="muted">Gerät an <b>${esc(nm)}</b> weitergeben – die anderen bitte wegschauen 🙈</p><button class="btn main big" type="button">👀 Ich bin ${esc(nm)} – aufdecken</button></div></div>`);
    box.querySelector('button').onclick = () => { this.shownFor = p; box.remove(); Sound.fx('flip'); };
    this.o.root.querySelector('.mp-play').appendChild(box);
  }
  bar() {
    if (this.dead || this.mp.bar === false) { this.tick(); return; }
    const e = this.e, tu = e ? e.turn : [], mp = this.mp, me = this.me;
    this.el.bar.innerHTML = this.o.seats.map((s, i) => {
      const bot = s.bot || (e && e.bots && e.bots[i]);
      let info = ''; try { info = e && mp.seatInfo ? mp.seatInfo(e.view, i) || '' : ''; } catch (er) { /* egal */ }
      const sub = [i === me && this.o.mode !== 'local' ? 'Du' : '', s.gone ? 'weg – Bot spielt' : '', info].filter(Boolean).join(' · ');
      return `<div class="mp-seat${tu.indexOf(i) >= 0 && !(e && e.over) ? ' on' : ''}${i === me ? ' me' : ''}${s.gone ? ' gone' : ''}" style="--sc:${SEAT_COL[i % 8]}"><span class="av">${bot ? '🤖' : esc((s.name[0] || '?').toUpperCase())}</span><span class="nm"><b>${esc(s.name)}</b><small>${sub}</small></span></div>`;
    }).join('');
    this.tick();
  }
  tick() {
    if (this.dead) return;
    const el = this.el.timer, e = this.e;
    if (!e || e.left == null || e.over) { el.style.visibility = 'hidden'; return; }
    const left = Math.max(0, e.left - (Date.now() - e._at)), tot = (this.api.turnTime || this.mp.turnTime || 25) * 1000, mine = this.me >= 0 && e.turn.indexOf(this.me) >= 0;
    el.style.visibility = 'visible'; el.classList.toggle('mine', mine); el.classList.toggle('low', left < 6000);
    el.firstElementChild.style.width = Math.min(100, left / tot * 100).toFixed(1) + '%';
    el.title = Math.ceil(left / 1000) + ' s';
    if (mine && left < 5500 && left > 0 && Math.ceil(left / 1000) !== this.lastTick) { this.lastTick = Math.ceil(left / 1000); Sound.fx('tick'); }
  }
  // ---------- Spielende: Platzierung, Coins (zentral), Knöpfe ----------
  end(res) {
    const o = this.o, me = this.me, mode = o.mode, g = this.g;
    const hadHumans = mode === 'online' && o.seats.some((s, i) => i !== me && !s.bot);
    const rw = MPCore.mpReward(res, mode === 'local' ? -1 : me, hadHumans, g, mode);
    let got = 0;
    if (me >= 0 && mode !== 'local') {
      Wallet.op({ op: 'played', g: g.id });
      if (rw.coins) got = this.capi.reward(rw.coins, g.title + (mode === 'online' ? ' online' : ' (Bots)') + ': ' + rw.label);
      if (rw.win) {
        if (g.unit === 'Siege') this.capi.score((Wallet.d.hs[g.id] || 0) + 1);
        else { const k = 'mp_' + g.id; Wallet.op({ op: 'score', g: k, v: (Wallet.d.hs[k] || 0) + 1 }); }
      }
    } else if (mode === 'local') Wallet.op({ op: 'played', g: g.id });
    const order = o.seats.map((s, i) => ({ s, i, r: res.ranks[i] })).sort((a, b) => a.r - b.r);
    const wn = o.seats[order[0].i] ? o.seats[order[0].i].name : '?';
    const title = mode === 'local' || me < 0 ? (res.draw ? '🤝 Unentschieden' : `🏆 ${esc(wn)} gewinnt!`)
      : res.draw ? '🤝 Unentschieden' : rw.place === 1 ? '🏆 Du gewinnst!' : `${medal(rw.place)} Platz ${rw.place}`;
    if (me >= 0 && mode !== 'local') Sound.fx(rw.place === 1 ? 'win' : 'lose'); else Sound.fx('win');
    const seq = this.e.seq;
    setTimeout(() => {
      if (this.dead || !this.e || this.e.seq !== seq) return;
      const btns = o.endButtons(res);
      const box = h(`<div class="over mp-end"><div class="box"><h2>${title}</h2>${res.text ? `<div class="muted">${esc(res.text)}</div>` : ''}
        <div class="mp-rank">${order.map((x) => `<div class="${x.i === me && mode !== 'local' ? 'me' : ''}"><span>${medal(x.r)}</span><b>${esc(x.s.name)}</b>${x.s.bot ? '<small>🤖</small>' : ''}</div>`).join('')}</div>
        <div class="gain">${got ? '+' + fmt(got) + ' 🪙' : mode === 'local' ? '<span class="muted" style="font-size:14px">Am selben Gerät gibt es nur Ruhm 😎</span>' : me < 0 ? '' : '<span class="muted" style="font-size:14px">keine Coins diesmal</span>'}</div>
        ${mode === 'bots' && got ? '<div class="muted" style="font-size:12px;margin:-8px 0 10px">Online gegen Freunde gibt es deutlich mehr 🪙</div>' : ''}
        <div class="rowc">${btns.map(([id, label, main]) => id ? `<button class="btn${main ? ' main' : ''}" type="button" data-a="${id}">${label}</button>` : `<span class="muted">${label}</span>`).join('')}</div></div></div>`);
      box.onclick = (ev) => { const a = ev.target.dataset.a; if (a) { box.remove(); o.onEnd(a); } };
      this.o.root.appendChild(box);
      this.endBox = box;
    }, this.mp.endDelay != null ? this.mp.endDelay : 1300);
  }
  destroy() { if (this.dead) return; this.dead = true; clearInterval(this.tm); try { this.capi._close(); } catch (e) { console.error(e); } if (this.endBox) this.endBox.remove(); }
}

// ================================================================
// Offline: gegen Bots / am selben Gerät (läuft in der Spielansicht)
// ================================================================
const Offline = {
  names: null,
  setup(g, mode, root, api) {
    const mp = g.mp;
    if (!this.names) this.names = [mpName(), 'Spieler 2', 'Spieler 3', 'Spieler 4', 'Spieler 5', 'Spieler 6', 'Spieler 7', 'Spieler 8'];
    const key = 'guru.mpset.' + g.id + '.' + mode, saved = ls.get(key, {}) || {};
    const S = { total: clamp(saved.total || (mode === 'bots' ? mp.seats || Math.min(4, mp.max) : 2), Math.max(2, mp.min), mp.max), bots: saved.bots || 0, opts: Object.assign(MPCore.defaults(g), saved.opts || {}) };
    const range = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };
    const draw = () => {
      S.bots = Math.min(S.bots, mp.max - S.total);
      let html = '';
      if (mode === 'bots') html += mp.max > 2 ? `<label class="mp-opt"><span>Mitspieler</span><select data-s="total">${range(Math.max(2, mp.min), mp.max).map((n) => `<option value="${n}"${S.total === n ? ' selected' : ''}>${n - 1} Bot${n > 2 ? 's' : ''}</option>`).join('')}</select></label>` : '';
      else {
        html += `<label class="mp-opt"><span>Menschen am Gerät</span><select data-s="total">${range(Math.max(2, mp.min), mp.max).map((n) => `<option value="${n}"${S.total === n ? ' selected' : ''}>${n}</option>`).join('')}</select></label>`;
        if (mp.bots && mp.max > S.total) html += `<label class="mp-opt"><span>Bots dazu</span><select data-s="bots">${range(0, mp.max - S.total).map((n) => `<option value="${n}"${S.bots === n ? ' selected' : ''}>${n}</option>`).join('')}</select></label>`;
        html += `<div class="mp-lnames">${range(0, S.total - 1).map((i) => `<label class="mp-p"><span class="av" style="background:${SEAT_COL[i]}">${i + 1}</span><input data-ln="${i}" value="${esc(this.names[i])}" maxlength="18" aria-label="Name Spieler ${i + 1}"></label>`).join('')}</div>`;
      }
      html += MPUI.optsHtml(g, S.opts, true);
      root.innerHTML = `<div class="gm mp-wrap"><div class="mp-title sm"><span class="mp-ic">${g.icon}</span><h2>${esc(g.title)} <small class="muted">· ${mode === 'bots' ? '🤖 Gegen Bots' : '👥 Am selben Gerät'}</small></h2></div>
        <div class="mp-card"><div class="muted" style="margin-bottom:8px">${mode === 'bots' ? 'Du gegen Bots – sofort los, ohne Internet. (Online gegen Freunde gibt es mehr Coins.)' : 'Reihum an einem Handy oder PC. ' + (mp.hidden ? 'Vor jedem Zug wird das Gerät weitergegeben – die Karten der anderen bleiben verdeckt. ' : '') + 'Hier gibt es nur Ruhm, keine Coins.'}</div>${html}</div>
        <div class="rowc mp-actions"><button class="btn main big" type="button" id="olGo">▶ Los geht's</button><button class="btn" type="button" id="olBack">← Zurück</button></div></div>`;
      root.querySelector('.mp-card').onchange = (e) => {
        const t = e.target;
        if (t.dataset.s) { S[t.dataset.s] = +t.value; draw(); }
        if (t.dataset.o) { const o = mp.opts.find((x) => x.id === t.dataset.o); S.opts[o.id] = t.type === 'checkbox' ? t.checked : (typeof o.def === 'number' ? +t.value : t.value); }
        if (t.dataset.ln !== undefined) this.names[+t.dataset.ln] = cleanName(t.value) || 'Spieler ' + (+t.dataset.ln + 1);
      };
      $('#olBack', root).onclick = () => UI.open(g.id, true);
      $('#olGo', root).onclick = () => { ls.set(key, S); this.start(g, mode, root, S); };
    };
    draw();
  },
  start(g, mode, root, S) {
    const mp = g.mp, seats = [];
    if (mode === 'bots') { seats.push({ name: mpName() }); for (let i = 1; i < S.total; i++) seats.push({ name: BOT_NAMES[(i - 1 + hashStr(today())) % BOT_NAMES.length], bot: true }); }
    else { for (let i = 0; i < S.total; i++) seats.push({ name: this.names[i], local: true }); for (let i = 0; i < S.bots; i++) seats.push({ name: BOT_NAMES[i % BOT_NAMES.length], bot: true }); }
    let active = 0, play = null, host = null;
    const localSeat = (tu) => { const p = tu.find((i) => seats[i] && seats[i].local); if (p !== undefined) active = p; return active; };
    const env = {
      now: () => Date.now(), turnTime: 0, botScale: Net.tparam('fast') ? 0.2 : 1,
      later: (fn, ms) => setTimeout(fn, ms), cancel: (id) => clearTimeout(id),
      onChange: (hh) => { if (!play) return; const me = mode === 'local' ? localSeat(hh.turn()) : 0; play.update(hh.viewFor(me)); },
      onError: (e) => console.error(e),
    };
    const stop = () => { if (host) host.stop(); host = null; if (play) play.destroy(); play = null; };
    UI.api && UI.api.onClose(stop);
    play = new MPPlay({
      g, root, me: 0, mode, seats, isHost: true,
      send: (a, me) => (host ? host.act(me, a) : { error: 'Kein Spiel' }),
      input: (i, seat) => host && host.input(seat, i),
      endButtons: () => [['again', '⟳ Nochmal', true], ['menu', '⚙️ Einstellungen'], ['back', '← Galerie']],
      onEnd: (a) => { stop(); if (a === 'again') this.start(g, mode, root, S); if (a === 'menu') this.setup(g, mode, root); if (a === 'back') UI.close(); },
    });
    host = new MPCore.Host(g, seats, Object.assign({}, S.opts), (Math.random() * 4294967296) >>> 0, env);
    env.onChange(host);
  },
};

// ================================================================
// Bausteine für die Oberfläche (Auswahl beim Öffnen eines Online-Spiels, Einstellungen)
// ================================================================
const MPUI = {
  optsHtml(g, vals, ed) {
    const dis = ed ? '' : 'disabled';
    return (g.mp.opts || []).map((o) => {
      const v = vals[o.id];
      const inp = o.type === 'toggle' ? `<input type="checkbox" data-o="${o.id}" ${v ? 'checked' : ''} ${dis}>`
        : `<select data-o="${o.id}" ${dis}>${o.choices.map(([cv, cl]) => `<option value="${esc(cv)}"${String(v) === String(cv) ? ' selected' : ''}>${esc(cl)}</option>`).join('')}</select>`;
      return `<label class="mp-opt"><span>${esc(o.label)}</span>${inp}</label>${o.hint ? `<div class="muted mp-hint">${esc(o.hint)}</div>` : ''}`;
    }).join('');
  },
  // Leiste über einem klassischen Spiel (TTT, Vier, Memory): Online-Wege + ggf. Bots
  strip(g, root, api) {
    const mp = g.mp;
    const el = h(`<div class="mp-strip"><span class="muted">🌐 Online ${mpPlayersLabel(mp)}:</span><button class="btn sm main" type="button" data-mm="stamm">🍺 Im Stammtisch spielen</button><button class="btn sm" type="button" data-mm="priv">🔒 Privaten Raum erstellen</button><button class="btn sm" type="button" data-mm="join">🔑 Raum beitreten</button>${mp.botsMode ? `<button class="btn sm" type="button" data-mm="bots">🤖 Gegen ${mp.max - 1} Bots</button>` : ''}</div>`);
    el.onclick = (e) => { const b = e.target.closest('[data-mm]'); if (b) this.pick(g, b.dataset.mm, root, api); };
    root.parentNode.insertBefore(el, root);
    // sobald das klassische Spiel losgeht, verschwindet die Leiste
    const mo = new MutationObserver(() => { if (!root.querySelector('[data-m],#mm_1')) { el.remove(); mo.disconnect(); } });
    mo.observe(root, { childList: true }); api.onClose(() => { mo.disconnect(); el.remove(); });
  },
  // Auswahl für reine Mehrspieler-Spiele
  chooser(g, root, api) {
    const mp = g.mp;
    root.innerHTML = `<div class="gm mp-wrap"><div class="mp-title"><span class="mp-ic">${g.icon}</span><div><h2>${esc(g.title)}</h2><div class="muted">${esc(g.desc)}</div><div class="meta" style="margin-top:6px"><span>🌐 Online ${mpPlayersLabel(mp)} Spieler</span>${mp.bots ? '<span>🤖 Bots</span>' : ''}${mp.local ? '<span>👥 Am selben Gerät</span>' : ''}</div></div></div>
      <div class="mp-modes">
        <button class="mp-mode hi" type="button" data-mm="stamm"><span>🍺</span><b>Im Stammtisch spielen</b><small>Der gemeinsame Raum für alle – wer da ist, spielt mit</small></button>
        <button class="mp-mode" type="button" data-mm="priv"><span>🔒</span><b>Privaten Raum erstellen</b><small>Link in Discord teilen – Freunde treten bei${mp.bots ? ', freie Plätze füllen Bots' : ''}</small></button>
        <button class="mp-mode" type="button" data-mm="join"><span>🔑</span><b>Raum beitreten</b><small>Mit dem 5-stelligen Code</small></button>
        ${mp.local ? '<button class="mp-mode" type="button" data-mm="local"><span>👥</span><b>Am selben Gerät</b><small>Reihum auf einem Handy oder PC</small></button>' : ''}
        ${mp.bots ? '<button class="mp-mode" type="button" data-mm="bots"><span>🤖</span><b>Gegen Bots</b><small>Sofort los, ohne Internet</small></button>' : ''}
      </div></div>`;
    root.querySelector('.mp-modes').onclick = (e) => { const b = e.target.closest('[data-mm]'); if (b) this.pick(g, b.dataset.mm, root, api); };
  },
  pick(g, m, root, api) {
    Sound.fx('click');
    if (m === 'bots' || m === 'local') { $$('.mp-strip').forEach((x) => x.remove()); Offline.setup(g, m, root, api); return; }
    if (m === 'join') { this.askCode((c) => { UI.close(); Room.join(c, { game: g.id }); UI.show('room'); }); return; }
    UI.close();
    if (m === 'stamm') Room.join(STAMMTISCH, { game: g.id });
    if (m === 'priv') Room.join(Net.newCode(), { game: g.id, create: true });
    UI.show('room');
  },
  askCode(cb) {
    const md = h(`<div class="modal"><form class="box" style="text-align:center"><h2 style="margin-bottom:8px">🔑 Raum beitreten</h2><p class="muted">Gib den 5-stelligen Raumcode ein (steht beim Host oben in der Lobby).</p>
      <input class="mp-codein" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE" aria-label="Raumcode"><div class="rowc" style="margin-top:12px"><button class="btn main" type="submit">Beitreten</button><button class="btn" type="button" data-x="1">Abbrechen</button></div></form></div>`);

    $('form', md).onsubmit = (e) => { e.preventDefault(); const c = Net.cleanCode(inp.value); if (!Net.validCode(c)) { toast('Der Code hat 5 Zeichen (Buchstaben/Ziffern).'); return; } md.remove(); cb(c); };
    document.body.appendChild(md); setTimeout(() => inp.focus(), 30);
  },
};

// ================================================================
// Room – Online-Raum (Stammtisch oder privat). Ein Raum gleichzeitig; bleibt verbunden,
// während man in Galerie/Shop stöbert. Lobby = Bereich „🌐 Zusammen spielen“.
// ================================================================
const Room = {
  st: 'off', // off | connecting | on | error | idle
  room: '', isHost: false, peer: null, hostConn: null, conns: new Map(), myId: '', L: null, host: null, play: null, playRound: -1,
  epoch: 0, err: '', errKind: '', note: '', newer: 0, want: null, rtt: 0, lastHost: 0, timers: [], lastEnv: null, hiddenAt: 0, endTimer: 0, welcomed: null,
  IDLE_MS: (() => { const v = Net.tparam('idlems'); return v && /^\d+$/.test(v) ? +v : 30 * 60e3; })(),
  get on() { return this.st === 'on'; },
  get g() { return this.L && this.L.game ? MG.byId[this.L.game] : null; },
  label(r = this.room) { return /^stammtisch/.test(r) ? '🍺 Stammtisch' + (r !== STAMMTISCH ? ' (Ausweichraum)' : '') : '🔒 Raum ' + String(r).toUpperCase(); },

  // ---------- Einstieg ----------
  join(room, want) {
    room = String(room || STAMMTISCH).toLowerCase();
    if (want && want.game && !MG.byId[want.game]) want.game = null;
    if (this.room === room && (this.st === 'on' || this.st === 'connecting')) { if (want) { this.want = want; if (this.on) this.applyWant(); } this.render(); return; }
    this.leave(true);

  },
  ensure() { if (this.st === 'off') this.join(this.room || STAMMTISCH); else { this.setHash(); this.render(); } },
  async connect(cached, first) {
    const ep = ++this.epoch;

    if (!Net.ready()) { this.fail('lib'); return; }
    let server = 0, stale = 0, nohost = 0;
    for (let attempt = 0; attempt < 30; attempt++) {
      if (ep !== this.epoch) return;
      let h = { r: 'taken' };
      if (first !== 'join' || nohost >= 2) {
        if (first === 'join' && nohost >= 2) { this.fail('nohost'); return; }
        h = await Net.tryHost(this.room);
        if (ep !== this.epoch) { if (h.peer) try { h.peer.destroy(); } catch (e) { /* egal */ } return; }
        if (h.r === 'ok') { this.setupHost(h.peer, cached); return; }
      }
      if (h.r === 'taken') {
        const j = await Net.tryJoin(this.room);
        if (ep !== this.epoch) { if (j.peer) try { j.peer.destroy(); } catch (e) { /* egal */ } return; }
        if (j.r === 'ok') {
          const w = await this.setupClient(j.peer, j.conn, ep);
          if (ep !== this.epoch) return;
          if (w === 'ok') return;
          if (w === 'proto') { this.note = Net.msg('proto'); this.render(); await sleepMs(4000); continue; }
          if (w === 'reload') return;
          stale++;
        } else if (j.r === 'nohost') nohost++;
        else if (j.r === 'timeout') stale++;
        else server++;
      } else server++;
      if (server >= 3) { this.fail('server'); return; }
      // Host-ID belegt, aber niemand antwortet (z. B. Host-Internet weg oder eingefrorener Tab). Der Signal-Server gibt
      // die ID nach ~1 min frei – so lange warten wir; danach weicht der Stammtisch aus, private Räume melden es.
      if (stale >= 1) { this.note = 'Der Host antwortet nicht – warte, bis der Raum frei wird …'; this.render(); }
      if (stale >= 5) {
        if (this.room === STAMMTISCH) { this.room = STAMMTISCH + '-2'; this.note = 'Der Stammtisch-Host antwortet nicht (vergessener Tab?) – ihr trefft euch im Ausweichraum.'; this.setHash(); stale = 0; first = 'host'; continue; }
        this.fail('stale'); return;
      }

    }

  },
  fail(kind) { this.netDown(); this.st = 'error'; this.errKind = kind; this.err = Net.msg(kind); this.render(); },
  netDown() {
    for (const t of this.timers) clearInterval(t); this.timers = [];
    const cs = [...this.conns.values()]; this.conns.clear();
    for (const c of cs) { try { c.conn.close(); } catch (e) { /* egal */ } }
    if (this.peer) { const p = this.peer; setTimeout(() => { try { p.destroy(); } catch (e) { /* egal */ } }, 100); }
    this.peer = null; this.hostConn = null; this.isHost = false;

  },
  every(f, ms) { const id = setInterval(f, ms); this.timers.push(id); return id; },
  // Raum verlassen (Knopf) – quiet: nur aufräumen (z. B. vor dem Wechsel)
  leave(quiet) {
    this.epoch++;

      if (this.isHost) for (const [, c] of this.conns) Net.send(c.conn, { t: 'bye', why: 'leave' });

    this.closePlay(true);
    this.netDown(); this.L = null; this.lastEnv = null; this.st = 'off'; this.playRound = -1;

  },

  // ---------- Host ----------
  setupHost(peer, cached) {
    this.peer = peer; this.isHost = true; this.myId = peer.id; this.st = 'on'; this.err = ''; this.lastEnv = null;
    const old = cached || null;
    this.L = {
      v: NET_VER, b: Net.build, room: this.room, hostId: peer.id, phase: 'lobby', game: old ? old.game : null, round: old ? old.round || 0 : 0,
      set: old ? old.set : null, seats: null, chat: old ? (old.chat || []).slice(-30) : [], done: false,
      players: [{ id: peer.id, name: mpName(), ready: true, vote: null, sk: mySkins() }],
    };
    if (this.L.game && !MG.byId[this.L.game]) { this.L.game = null; this.L.set = null; }
    if (old) this.note = '👑 Du bist jetzt Host' + (old.phase === 'play' && !old.done ? ' – die laufende Runde wurde leider abgebrochen.' : '.');
    else this.note = '';
    peer.on('connection', (conn) => {
      conn.on('open', () => { this.conns.set(conn.peer, { conn, last: Date.now(), name: '', b: 0 }); });
      conn.on('data', (d) => this.hostRecv(conn.peer, d));
      conn.on('close', () => this.drop(conn.peer));
      conn.on('error', () => this.drop(conn.peer));
    });
    peer.on('disconnected', () => { if (this.peer === peer && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch (e) { /* egal */ } }, 1500); });
    peer.on('error', (e) => { if (e && e.type !== 'peer-unavailable') console.warn('Host-Fehler', e.type); });
    this.every(() => { const t = Date.now(); for (const [pid, c] of this.conns) if (t - c.last > 12000) this.drop(pid); }, 2000);
    this.every(() => this.idleCheck(), Math.min(30000, Math.max(500, this.IDLE_MS / 4)));
    if (this.room !== STAMMTISCH && /^stammtisch/.test(this.room)) this.every(() => this.mergeCheck(), 90000);
    this.applyWant();
    this.push();
    if (old) toast('👑 Du bist jetzt Host – die anderen kommen gleich zurück.', 3500);
  },
  applyWant() {
    const w = this.want; if (!w || !this.on) return; this.want = null;
    if (w.game) { if (this.isHost) { if (this.L.phase === 'lobby') this.selectGame(w.game); } else this.sendSet({ vote: w.game, ready: true }); }
  },
  hostRecv(pid, d) {
    const c = this.conns.get(pid); if (!c || !d || typeof d !== 'object') return;
    c.last = Date.now();
    const L = this.L; if (!L) return;
    const P = L.players.find((p) => p.id === pid);
    switch (d.t) {
      case 'hello': {
        const b = +d.b || 0; c.b = b;
        if (d.v !== NET_VER) {
          if (b > Net.build) { Net.send(c.conn, { t: 'proto', b: Net.build }); this.outdated(b); } else Net.send(c.conn, { t: 'reload', b: Net.build });
          setTimeout(() => { try { c.conn.close(); } catch (e) { /* egal */ } }, 600); return;
        }
        const name = this.uniqueName(cleanName(d.name) || 'Gast', pid);
        const sk = cleanSkins(d.sk);
        if (P) { P.name = name; P.sk = sk; this.push(); return; }
        if (L.players.length >= 16) { Net.send(c.conn, { t: 'err', text: 'Der Raum ist voll (16 Leute).' }); return; }
        const running = L.phase === 'play' && !L.done;
        const seatIdx = running && L.seats ? L.seats.findIndex((s) => s.gone && s.name.toLowerCase() === name.toLowerCase()) : -1;
        L.players.push({ id: pid, name, ready: running, vote: null, sk });
        c.name = name;
        Net.send(c.conn, { t: 'welcome', id: pid, b: Net.build, room: L });
        if (b > Net.build) { Net.send(c.conn, { t: 'old', b: Net.build }); this.outdated(b); }
        else if (b && b < Net.build) Net.send(c.conn, { t: 'reload', b: Net.build });
        if (seatIdx >= 0) { const s = L.seats[seatIdx]; s.id = pid; s.gone = false; s.bot = false; if (this.host) this.host.setBot(seatIdx, false); this.toastAll(`🔌 ${name} ist zurück und spielt weiter.`); }
        else this.toastAll(running ? `👀 ${name} schaut zu und ist nächste Runde dabei` : `👋 ${name} ist da`, pid);
        this.push();
        if (L.phase === 'play' && this.host) Net.send(c.conn, this.envMsg(this.seatOf(pid)));
        return;
      }
      case 'set': {
        if (!P) return;
        if (d.name) P.name = this.uniqueName(cleanName(d.name) || P.name, pid);
        if (typeof d.ready === 'boolean') P.ready = d.ready;
        if (d.sk && typeof d.sk === 'object') P.sk = cleanSkins(d.sk);
        if (d.vote === null || (typeof d.vote === 'string' && MG.byId[d.vote] && MG.byId[d.vote].mp)) P.vote = d.vote;
        this.push(); return;
      }
      case 'chat': if (P) this.addChat(P.name, d.text); return;
      case 'act': {
        const s = this.seatOf(pid); if (s < 0 || !this.host) { Net.send(c.conn, { t: 'no', text: 'Du spielst diese Runde nicht mit.' }); return; }
        const r = this.host.act(s, d.a); if (r.error) Net.send(c.conn, { t: 'no', text: r.error }); return;
      }
      case 'in': { const s = this.seatOf(pid); if (s >= 0 && this.host) this.host.input(s, d.i); return; }
      case 'ping': Net.send(c.conn, { t: 'pong', c: d.c, h: Date.now() }); return;
      case 'unseat': this.unseat(pid); return;

  },
  uniqueName(nm, pid) {
    const L = this.L; let n = nm, k = 2;
    while (L.players.some((p) => p.id !== pid && p.name.toLowerCase() === n.toLowerCase())) n = nm.slice(0, 15) + ' ' + k++;

  },
  seatOf(pid) { const s = this.L && this.L.seats; return s ? s.findIndex((x) => x.id === pid && !x.gone) : -1; },
  drop(pid) {

    const P = L.players.find((p) => p.id === pid); L.players = L.players.filter((p) => p.id !== pid);

    if (s >= 0 && L.phase === 'play' && !L.done) { L.seats[s].gone = true; if (this.host) this.host.setBot(s, true); this.toastAll(`📴 ${P ? P.name : 'Jemand'} ist raus – ein Bot übernimmt den Platz.`); }
    else if (P) this.toastAll(`👋 ${P.name} ist gegangen`);

  },
  // Spieler verlässt die laufende Runde, bleibt aber im Raum
  unseat(pid) {
    const L = this.L, P = L && L.players.find((p) => p.id === pid); if (!P) return;
    P.ready = false;
    const s = this.seatOf(pid);
    if (s >= 0 && L.phase === 'play' && !L.done) { L.seats[s].gone = true; if (this.host) this.host.setBot(s, true); this.toastAll(`🚪 ${P.name} hat die Runde verlassen – ein Bot spielt weiter.`); }

  },
  toastAll(text, except) { for (const [pid, c] of this.conns) if (pid !== except) Net.send(c.conn, { t: 'toast', text }); toast(esc(text)); },
  addChat(n, text) {
    text = String(text || '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, 120); if (!text) return;
    const L = this.L; const m = { n, text, t: Date.now() }; L.chat.push(m); if (L.chat.length > 30) L.chat.shift();
    for (const [, c] of this.conns) Net.send(c.conn, { t: 'chat', m });
    this.chatIn(m, true);
  },
  push() {
    const L = this.L; if (!L || !this.isHost) return;
    for (const [, c] of this.conns) if (c.name) Net.send(c.conn, { t: 'room', room: L });
    this.onRoom();
  },
  // Host-Bedienung
  selectGame(id) {
    const g = MG.byId[id], L = this.L; if (!this.isHost || !g || !g.mp || L.phase === 'play' && !L.done) return;
    if (L.game !== id) {
      const mp = g.mp; L.game = id;
      L.set = { total: clamp(mp.seats || Math.min(4, mp.max), mp.min, mp.max), fill: !!mp.bots, opts: MPCore.defaults(g) };
      for (const p of L.players) if (p.id !== this.myId) p.ready = false;

    }
    this.push();
  },
  setSetting(k, v) { const L = this.L; if (!this.isHost || !L.set) return; if (k in L.set) L.set[k] = v; this.push(); },
  setOpt(k, v) { const L = this.L; if (!this.isHost || !L.set) return; L.set.opts[k] = v; this.push(); },
  seatPlan(L) {
    const g = MG.byId[L.game]; if (!g) return { humans: [], bots: 0 };
    const mp = g.mp, humans = L.players.filter((p) => p.ready).slice(0, mp.max);
    const want = L.set && L.set.fill && mp.bots ? Math.max(humans.length, Math.min(L.set.total, mp.max)) : humans.length;
    return { humans, bots: Math.max(0, want - humans.length), total: want };
  },
  cantStart(L) {
    const g = L && MG.byId[L.game]; if (!g) return 'Erst ein Spiel auswählen.';
    const mp = g.mp, pl = this.seatPlan(L);
    if (!pl.humans.length) return 'Niemand ist bereit – drück „✅ Bereit“.';
    if (pl.total < mp.min) return `Mindestens ${mp.min} Spieler – noch ${mp.min - pl.total} „Bereit“ fehlen${mp.bots ? ' (oder Bots auffüllen einschalten)' : ''}.`;
    return '';
  },
  start() {
    const L = this.L; if (!this.isHost || this.cantStart(L)) return;
    if (L.phase === 'play' && !L.done) return;
    const g = MG.byId[L.game], mp = g.mp, pl = this.seatPlan(L);
    const seats = pl.humans.map((p) => ({ id: p.id, name: p.name, sk: cleanSkins(p.sk) }));
    const hostP = L.players.find((p) => p.id === L.hostId);
    L.tsk = cleanSkins(hostP ? hostP.sk : mySkins());
    const used = new Set(seats.map((s) => s.name)); let bi = 0;
    while (seats.length < pl.total) { const nm = BOT_NAMES[(bi + L.round) % BOT_NAMES.length]; bi++; if (used.has(nm) && bi < 40) continue; used.add(nm); seats.push({ id: 'bot' + seats.length, name: nm, bot: true }); }
    L.seats = seats; L.phase = 'play'; L.done = false; L.round = (L.round || 0) + 1;
    if (this.host) this.host.stop();
    this.host = null;
    this.closePlay(true);
    const env = {
      now: () => Date.now(), turnTime: MPCore.turnTimeOf(mp, L.set.opts), botScale: Net.tparam('fast') ? 0.2 : 1,
      later: (fn, ms) => setTimeout(fn, ms), cancel: (id) => clearTimeout(id),
      onChange: (hh) => { if (hh === this.host || !this.host) this.broadcast(hh); },
      onError: (e) => console.error(e),
    };
    this.lastEnv = null;
    this.host = new MPCore.Host(g, seats.map((s) => ({ name: s.name, bot: !!s.bot })), Object.assign({}, L.set.opts, { _round: L.round }), (Math.random() * 4294967296) >>> 0, env);
    this.push();
    this.broadcast(this.host);
  },
  envMsg(seat) { return { t: this.g && this.g.mp.realtime ? 's' : 'v', e: this.host.viewFor(seat) }; },
  broadcast(hh) {
    const L = this.L; if (!hh || !L) return;
    this.host = hh;
    for (const [pid, c] of this.conns) if (c.name) Net.send(c.conn, this.envMsg(this.seatOf(pid)));
    const e = hh.viewFor(this.seatOf(this.myId));

      clearTimeout(this.endTimer); const r = L.round;

  },
  again() { const L = this.L; if (!this.isHost || !L) return; if (this.newer) { this.tryReload(); return; } for (const s of L.seats || []) { const p = L.players.find((q) => q.id === s.id); if (p && !s.gone) p.ready = true; } L.done = true; this.start(); },
  toLobby() { const L = this.L; if (!this.isHost || !L) return; clearTimeout(this.endTimer); if (this.host) this.host.stop(); this.host = null; L.phase = 'lobby'; L.done = false; L.seats = null; this.lastEnv = null; this.push(); this.tryReload(); },

  // Ausweichraum: ist der echte Stammtisch wieder frei oder erreichbar? Dann ziehen alle um.
  async mergeCheck() {

    this.merging = true;

      const h = await Net.tryHost(STAMMTISCH);

      if (h.r === 'ok') { go = true; try { h.peer.destroy(); } catch (e) { /* egal */ } }

        for (const [, c] of this.conns) Net.send(c.conn, { t: 'move', room: STAMMTISCH });

      }

  },

  // ---------- Version & Inaktivität ----------
  roundRunning() { const L = this.L; return !!(L && L.phase === 'play' && !L.done); },
  outdated(b) {
    if (b <= Net.build) return;
    this.newer = Math.max(this.newer, b);
    this.note = '🆕 Es gibt eine neue Version – die Seite lädt neu, sobald keine Runde läuft.';
    this.render(); this.tryReload();
  },
  tryReload() {
    if (!this.newer || this.roundRunning()) return;
    if (this.isHost) for (const [, c] of this.conns) Net.send(c.conn, { t: 'bye', why: 'reload' });
    const target = this.newer;
    const rh = '#zusammen' + (this.room && this.room !== STAMMTISCH ? '=' + this.room : ''); // nach dem Neuladen wieder in den Raum
    try { history.replaceState(null, '', location.pathname + location.search + rh); } catch (e) { /* egal */ }
    setTimeout(() => {
      if (!Net.reload(target)) {
        // schon einmal neu geladen und immer noch alt (Cache) → wenigstens die Host-Rolle freigeben
        this.newer = 0; const r = this.room; this.leave(true); this.room = r;
        this.note = '🆕 Neue Version verfügbar – bitte die Seite neu laden (Strg+F5 / ganz neu öffnen).'; this.st = 'connecting'; this.render();
        setTimeout(() => { if (this.room === r && this.st === 'connecting') this.connect(null, 'join'); }, 3000);
      }
    }, 300);
  },
  async versionCheck() {
    if (!this.on) return;
    const b = await Net.latest();
    if (b > Net.build) { if (this.isHost) this.outdated(b); else { this.newer = b; this.note = '🆕 Neue Version verfügbar – lädt neu, sobald keine Runde läuft.'; this.render(); this.tryReload(); } }
  },
  idleCheck() {
    if (!this.isHost || !this.on || !document.hidden || !this.hiddenAt) return;
    if (Date.now() - this.hiddenAt < this.IDLE_MS || this.roundRunning()) return;
    // lange im Hintergrund ohne Spiel: Host-Rolle abgeben, damit der Raum nicht blockiert
    for (const [, c] of this.conns) Net.send(c.conn, { t: 'bye', why: 'idle' });
    const r = this.room; this.leave(true); this.room = r; this.st = 'idle'; this.setHash(); this.render();
  },

  // ---------- Client ----------
  setupClient(peer, conn, ep) {
    return new Promise((res) => {

      let done = false; const fin = (v) => { if (done) return; done = true; clearTimeout(to); if (v !== 'ok') { this.netDown(); } res(v); };
      const to = setTimeout(() => fin('stale'), 6000);

      conn.on('close', () => { if (ep !== this.epoch) return; if (!done) fin('stale'); else this.lostHost('close'); });
      conn.on('error', () => { if (ep !== this.epoch) return; if (!done) fin('stale'); else this.lostHost('error'); });
      peer.on('disconnected', () => setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) { /* egal */ } }, 2000));
      peer.on('error', () => { /* egal */ });

    });
  },
  clientRecv(d) {
    if (!d || typeof d !== 'object') return;

    switch (d.t) {
      case 'welcome': {
        this.myId = d.id; this.L = d.room; this.st = 'on'; this.err = ''; if (!/Ausweichraum|Version/.test(this.note)) this.note = '';

        this.every(() => { if (Date.now() - this.lastHost > 9000) this.lostHost('timeout'); }, 1000);
        Net.send(this.hostConn, { t: 'ping', c: Date.now() });

      }
      case 'room': if (d.room && typeof d.room === 'object') { this.L = d.room; this.onRoom(); } break;
      case 'v': case 's': this.onEnv(d.e); break;
      case 'no': toast('⛔ ' + esc(d.text)); Sound.fx('bad'); break;
      case 'toast': toast(esc(d.text)); break;
      case 'chat': if (this.L) { this.L.chat = (this.L.chat || []).concat([d.m]).slice(-30); } this.chatIn(d.m); break;

      case 'bye': this.lostHost(d.why || 'leave'); break;
      case 'move': if (d.room === STAMMTISCH) { const r = Math.random() * 800; setTimeout(() => this.join(STAMMTISCH), 1500 + r); } break;
      case 'old': this.note = '⏳ Der Host hat noch eine ältere Version – er lädt gleich neu (wenn keine Runde läuft), dann geht\'s hier weiter.'; this.hostOld = true; this.render(); break;

      case 'reload': {
        // ich bin älter als der Host → neu laden (außer mitten in einer eigenen Runde)

        if (this.play && this.roundRunning() && this.mySeat() >= 0) { this.note = '🆕 Neue Version verfügbar – lädt nach der Runde neu.'; this.newer = d.b; this.render(); break; }
        this.welcomed = null;
