<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guruhalle MiniGame Center</title>
<meta name="theme-color" content="#0b0907">
<style>
:root{--bg:#0b0907;--panel:#15110d;--panel2:#1d1712;--line:#3a2e20;--txt:#f5eee2;--mut:#b5a690;--org:#f7931a;--gold:#f2b33d;--green:#3ecf8e;--red:#ff5a5a;--blue:#5ab4ff;--purple:#b07cff;--r:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:0 max(12px,env(safe-area-inset-right)) 40px max(12px,env(safe-area-inset-left))}
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.btn.main{background:linear-gradient(180deg,#ffb347,#f7931a);border-color:#ffcf86;color:#1a0e00}
.btn.green{background:linear-gradient(180deg,#5be3a5,#2bb673);border-color:#8ff0c3;color:#03200f}
.btn.red{background:linear-gradient(180deg,#ff7b7b,#e04040);border-color:#ffb0b0;color:#2a0000}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:12px 22px;font-size:17px;border-radius:12px}
.muted{color:var(--mut)}
h1,h2,h3{margin:0}
/* Kopf */
#top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bg) 80%,rgba(11,9,7,0));padding:12px 0 10px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo .gp{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle at 35% 30%,#ffc56b,#f7931a 55%,#b85f05);box-shadow:0 0 16px rgba(247,147,26,.4)}
.logo b{display:block;font-size:18px;letter-spacing:.02em}
.logo small{color:var(--mut);font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;font-size:14px}
.pill.c{border-color:#7a5a1c;color:var(--gold)}
.pill.s{color:#ffd166}.pill.p{color:#9fd8ff}
.pill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18);box-shadow:0 0 14px rgba(242,179,61,.7)}}
nav.sec{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.sec button{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
nav.sec button.on{background:linear-gradient(180deg,#ffb347,#f7931a);border-color:#ffcf86;color:#1a0e00}
/* Galerie */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);padding:10px 0;font:inherit;min-width:0}
.search:focus-within{border-color:var(--gold)}
select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap;font-size:14px}
.chip.on{border-color:var(--gold);background:#2a1f10;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.gc:hover{transform:translateY(-2px);border-color:#6b5230}
.gc .art{position:relative;height:120px;display:grid;place-items:center;font-size:56px;overflow:hidden;cursor:pointer}
.gc .art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px)}
.gc .art span{position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2}
.bdg{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.55);letter-spacing:.03em}
.bdg.new{background:var(--green);color:#03200f}.bdg.hot{background:var(--red);color:#fff}
.gc .body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.gc h3{font-size:16px}
.gc p{margin:0;color:var(--mut);font-size:13px;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.meta span{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.gc .foot{display:flex;align-items:center;gap:8px;margin-top:4px}
.gc .foot .best{font-size:12px;color:var(--gold);margin-right:auto}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.banner{display:flex;gap:14px;align-items:center;background:linear-gradient(110deg,#2a1a08,#15110d 60%);border:1px solid #5a4020;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;flex-wrap:wrap}
.banner .bi{font-size:40px;flex:none!important;min-width:0!important}
.banner div{flex:1;min-width:200px}
.banner b{color:var(--gold)}
.bar{height:6px;background:#2a2219;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f7931a,#ffd166)}
/* Karten-Panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h2{font-size:14px;letter-spacing:.08em;color:var(--gold);margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
/* Shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.si{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.si.eq{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.si .pv{height:96px;border-radius:9px;display:grid;place-items:center;background:#0f0c09;overflow:hidden}
.si b{font-size:14px}
.si small{font-size:12px;color:var(--mut)}
.rar{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.r1{color:#c9bfae}.r2{color:var(--blue)}.r3{color:var(--purple)}.r4{color:var(--gold)}
.si.r4{background:linear-gradient(160deg,#2b2111,#1d1712 60%)}
.deal{position:absolute;right:8px;top:8px;background:var(--red);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;z-index:2}
.cardback{width:58px;height:82px;border-radius:7px;border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.felt{width:120px;height:70px;border-radius:40px;border:5px solid #5a3b1c;box-shadow:inset 0 0 18px rgba(0,0,0,.6)}
.frame{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#2a2219}
.ttl{font-weight:800;padding:5px 10px;border-radius:8px;background:#2a2219;font-size:14px}
/* Wechselstube */
.xrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.xrow input[type=range]{flex:1;min-width:140px;accent-color:var(--org)}
.rate{font-variant-numeric:tabular-nums;font-weight:700}
.up{color:var(--green)}.dn{color:var(--red)}
.log{max-height:260px;overflow:auto;font-size:13px}
.log div{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #241c14}
.log div span:last-child{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.howto li{margin:4px 0}
code{background:#241c14;border-radius:5px;padding:1px 5px;font-size:12.5px}
/* Spielansicht */
#play{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#play[hidden]{display:none}
.phead{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel)}
.phead .t{font-weight:800;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.phead .t small{font-weight:600;color:var(--gold);margin-left:8px}
#stage{flex:1;position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:14px max(10px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
#stage .gm{width:100%;max-width:760px;margin:0 auto}
.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.hud span{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.rowc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.msg{min-height:26px;font-weight:700;text-align:center}
.over{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,9,7,.78);z-index:30;padding:16px;animation:tin2 .25s}@keyframes tin2{from{opacity:0}}
.over .box{background:var(--panel);border:1px solid #6b5230;border-radius:16px;padding:20px 22px;text-align:center;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.over h2{font-size:24px;margin-bottom:6px}
.over .gain{font-size:22px;color:var(--gold);font-weight:800;margin:8px 0 14px}
/* Spielkarten */
.pc{width:72px;height:104px;border-radius:9px;background:#fbf7ee;color:#1b1b1b;display:flex;flex-direction:column;justify-content:space-between;padding:5px 7px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.45);position:relative;flex:none;user-select:none}
.pc.red{color:#d42a2a}
.pc .c{font-size:30px;align-self:center;line-height:1}
.pc .r{font-size:18px;line-height:1}
.pc .rb{transform:rotate(180deg)}
.pc.big{width:110px;height:158px;border-radius:12px;padding:8px 10px}
.pc.big .c{font-size:52px}.pc.big .r{font-size:26px}
.pc.sm{width:46px;height:66px;padding:3px 5px;border-radius:6px}
.pc.sm .c{font-size:19px}.pc.sm .r{font-size:13px}
.pc.back{background:var(--cb,#7a1f1f);border:3px solid #fbf7ee}
.pc.deal{animation:dealIn .3s ease-out}
@keyframes dealIn{from{transform:translateY(-30px) rotate(-8deg);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#241a0e;border:1px solid var(--gold);color:var(--txt);padding:9px 16px;border-radius:12px;z-index:50;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.6);max-width:92vw;text-align:center;animation:tin .25s}
@keyframes tin{from{transform:translate(-50%,20px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;max-width:440px;width:100%;max-height:85vh;overflow:auto}
canvas{touch-action:none;display:block}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .gc .art{height:92px;font-size:44px}
  .gc p{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gc h3{font-size:14.5px}
  .gc .foot{flex-wrap:wrap}.gc .foot .btn{width:100%}
  .logo small{display:none}
  .pc{width:58px;height:84px}.pc .c{font-size:24px}
  .pc.big{width:92px;height:132px}.pc.big .c{font-size:44px}
  .shopgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phead .t small{display:none}
  #top{position:static}
  .banner{padding:10px 12px;gap:10px}.banner .bi{display:none}.banner div{min-width:0;flex:1 1 55%;font-size:13.5px}
}
</style>
</head>
<body>
<header id="top">
  <div class="hrow">
    <div class="logo"><div class="gp">🎮</div><div><b>MiniGame Center</b><small>Guruhalle Stammtisch · Zocken, Coins sammeln, Skins holen</small></div></div>
    <div class="pills" id="pills"></div>
  </div>
  <nav class="sec" id="secnav">
    <button type="button" data-s="games" class="on">🕹️ Spiele</button>
    <button type="button" data-s="shop">🛍️ Skin-Shop</button>
    <button type="button" data-s="board">🏆 Bestenliste</button>
    <button type="button" data-s="bank">💱 Wechselstube</button>
    <button type="button" data-s="me">👤 Konto</button>
  </nav>
</header>
<main id="main"></main>
<section id="play" hidden>
  <div class="phead">
    <button class="btn sm" id="backBtn" type="button" title="Zurück zur Galerie (Esc)">← Galerie</button>
    <div class="t" id="pTitle"></div>
    <span class="pill c" id="pCoins"></span>
    <button class="btn sm" id="helpBtn" type="button" title="Spielregeln">?</button>
    <button class="btn sm" id="restartBtn" type="button" title="Neu starten">⟳</button>
  </div>
  <div id="stage"></div>
</section>
<script>
// ================================================================
// GuruCore – gemeinsame Regeln für Browser UND Konto-Server (Apps Script)
// Ohne DOM, ohne Module: wird in minigames.html und in Konten.gs eingebaut.
// Die Geldbörse ändert sich nur über applyOp(): der Browser rechnet sofort (flüssig),
// der Server rechnet dieselbe Operation nach und hat das letzte Wort.
// ================================================================
var GuruCore = (function () {
  var DAY_CAP = 600;                               // max. 🪙 pro Tag aus MiniGames
  var CRED_CAP = { sats: 1000, chips: 50000 };     // max. ⚡/♠ pro Tag aus Kart/Poker (je ≈ 500 🪙)
  var CRED_MSG = { sats: 500, chips: 100000 };     // max. pro einzelner Gutschrift
  var REWARD_MAX = 200;                            // max. 🪙 pro einzelner Belohnung
  var LOW_GAMES = { memory: true };                // Rekord = kleinster Wert
  var BASE = { sats: 0.5, chips: 0.01 };           // 2 ⚡ = 1 🪙 · 100 ♠ = 1 🪙 (Grundkurs, täglich ±15 %)
  // [id, Platz, Name, Preis, Seltenheit]
  var SKIN_DATA = [
    ['k_orange', 'kart', 'Orange Pill', 120, 1], ['k_laser', 'kart', 'Laser Eyes', 260, 2], ['k_diamond', 'kart', 'Diamond Hands', 480, 3],
    ['k_bear', 'kart', 'Bärenmarkt', 200, 2], ['k_lambo', 'kart', 'Wen Lambo (Gold)', 900, 4], ['k_moon', 'kart', 'Moon-Chrome', 650, 3],
    ['b_green', 'boost', 'Grüne Kerze', 150, 2], ['b_plasma', 'boost', 'Lila Plasma', 320, 3], ['b_rainbow', 'boost', 'Bullrun-Regenbogen', 700, 4],
    ['c_classic', 'cards', 'Stammtisch Klassik', 80, 1], ['c_btc', 'cards', 'Bitcoin-Netz', 220, 2], ['c_candle', 'cards', 'Candlestick', 300, 3], ['c_gold', 'cards', 'Guru-Gold', 800, 4],
    ['f_green', 'felt', 'Grün Klassik', 100, 1], ['f_red', 'felt', 'Bärenrot', 240, 2], ['f_night', 'felt', 'Mitternachts-Chart', 380, 3], ['f_orange', 'felt', 'Orange Pill Lounge', 750, 4],
    ['fr_bull', 'frame', 'Bullen-Rahmen', 150, 2], ['fr_whale', 'frame', 'Wal-Rahmen', 420, 3], ['fr_rocket', 'frame', 'To-the-Moon-Rahmen', 850, 4],
    ['t_paper', 'title', '„Paperhands“', 30, 1], ['t_hodl', 'title', '„HODLer“', 120, 2], ['t_guru', 'title', '„Chart-Guru“', 400, 3], ['t_satoshi', 'title', '„Satoshis Erbe“', 1500, 4],
  ];
  var SKIN_BY = {};
  SKIN_DATA.forEach(function (s) { SKIN_BY[s[0]] = { id: s[0], slot: s[1], name: s[2], price: s[3], rar: s[4] }; });

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hashStr(s) { var x = 2166136261; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
  function seeded(seed) { var s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function rate(cur, date) { return BASE[cur] * (0.85 + seeded(hashStr(cur + today(date)))() * 0.3); }
  function dailyDeal(date) { return SKIN_DATA[Math.floor(seeded(hashStr('deal' + today(date)))() * SKIN_DATA.length)][0]; }
  function priceOf(id, date) { var s = SKIN_BY[id]; if (!s) return null; return id === dailyDeal(date) ? Math.round(s.price * 0.7) : s.price; }
  function num(x) { x = Math.round(Number(x)); return isFinite(x) ? x : 0; }
  function txt(s, n) { return String(s == null ? '' : s).replace(/[<>]/g, '').slice(0, n || 60); }
  function gid(g) { g = String(g || ''); return /^[a-z0-9_]{2,20}$/.test(g) ? g : ''; }

  function blank(now) {
    now = now || Date.now();
    return { v: 1, coins: 100, sats: 0, chips: 0, owned: {}, equip: {}, log: [{ t: now, cur: 'coins', n: 100, why: 'Willkommensbonus 🎁' }],
      day: today(new Date(now)), dayEarn: 0, dayCred: { sats: 0, chips: 0 }, bet: 0, hs: {}, plays: {}, stats: { games: 0, earned: 100 }, spin: '', seen: [] };
  }
  // fehlende Felder ergänzen, Tageszähler um Mitternacht zurücksetzen
  function normalize(d, now) {
    now = now || Date.now();
    var b = blank(now);
    if (!d || typeof d !== 'object' || d.v !== 1) return b;
    for (var k in b) if (d[k] === undefined || d[k] === null) d[k] = b[k];
    var t = today(new Date(now));
    if (d.day !== t) { d.day = t; d.dayEarn = 0; d.dayCred = { sats: 0, chips: 0 }; d.bet = 0; }
    return d;
  }
  function log(d, cur, n, why, now) { d.log.unshift({ t: now, cur: cur, n: n, why: txt(why) }); if (d.log.length > 40) d.log.length = 40; }

  // Eine Operation anwenden. Rückgabe {ok, err?, got?}. Jede Operation hat eine id → doppelt gesendete zählen nur einmal.
  function applyOp(d, op, now) {
    now = now || Date.now();
    if (!op || typeof op !== 'object') return { ok: false, err: 'kaputt' };
    normalize(d, now);
    if (op.id && d.seen.indexOf(op.id) >= 0) return { ok: true, dup: true };
    var r = apply_(d, op, now, new Date(now));
    if (r.ok && op.id) { d.seen.push(String(op.id).slice(0, 24)); if (d.seen.length > 150) d.seen.splice(0, d.seen.length - 150); }
    return r;
  }
  function apply_(d, op, now, date) {
    var n = num(op.n), g = gid(op.g);
    switch (op.op) {
      case 'reward': { // MiniGame-Gewinn
        n = Math.max(0, Math.min(REWARD_MAX, n));
        var got = Math.min(n, Math.max(0, DAY_CAP - d.dayEarn));
        if (!n) return { ok: true, got: 0 };
        if (!got) return { ok: true, got: 0, err: 'limit' };
        d.coins += got; d.dayEarn += got; d.stats.earned += got; log(d, 'coins', got, op.why, now);
        return { ok: true, got: got };
      }
      case 'spend': { // Coins ausgeben (Einsatz, Glücksrad); bet: 'new' | 'add' merkt den offenen Einsatz
        if (n <= 0 || d.coins < n) return { ok: false, err: 'zu wenig' };
        d.coins -= n; log(d, 'coins', -n, op.why, now);
        if (op.bet === 'new') d.bet = n; else if (op.bet === 'add') d.bet += n;
        return { ok: true };
      }
      case 'refund': { // Einsatz zurück – höchstens der offene Einsatz
        n = Math.max(0, Math.min(n, d.bet)); d.bet = 0;
        if (n) { d.coins += n; log(d, 'coins', n, op.why || 'Einsatz zurück', now); }
        return { ok: true, got: n };
      }
      case 'credit': { // ⚡ aus dem Kart / ♠ aus dem Poker
        var cur = op.cur; if (!CRED_CAP[cur]) return { ok: false, err: 'währung' };
        n = Math.max(0, Math.min(CRED_MSG[cur], n));
        var c = Math.min(n, Math.max(0, CRED_CAP[cur] - (d.dayCred[cur] || 0)));
        if (!c) return { ok: true, got: 0, err: n ? 'limit' : undefined };

function makeApi(g, root, hooks) {
  const cleans = [];
  let alive = true;
  const api = {
    root, game: g, name: playerName(),
    get alive() { return alive; },
    // Belohnung: Coins gutschreiben (Tageslimit) – zeigt Toast + Animation
    reward(n, why) { const got = Wallet.earn(n, why || g.title); if (got) { Sound.fx('coin'); hooks.bump(); } return got; },
    spend(n, why, bet) { const ok = Wallet.spend('coins', n, why || g.title, bet); if (ok) hooks.bump(); return ok; },
    // Einsatz zurückgeben (zählt nicht zum Tageslimit) – z. B. bei Unentschieden oder als Teil eines Gewinns
    refund(n, why) { const got = Wallet.op({ op: 'refund', n: Math.round(n), why: why || 'Einsatz zurück' }).got || 0; if (got) hooks.bump(); return got; },
    coins() { return Wallet.d.coins; },
    // Highscore melden → true, wenn neuer Rekord
    score(v) { const r = Wallet.op({ op: 'score', g: g.id, v }); if (r.better) hooks.title(); return !!r.better; },
    best() { return Wallet.d.hs[g.id]; },
    played() { Wallet.op({ op: 'played', g: g.id }); },
    sfx: (k) => Sound.fx(k), toast,
    timeout(f, ms) { const id = setTimeout(() => alive && f(), ms); cleans.push(() => clearTimeout(id)); return id; },
    interval(f, ms) { const id = setInterval(() => alive && f(), ms); cleans.push(() => clearInterval(id)); return id; },
    raf(f) { let id = 0, last = performance.now(); const loop = (t) => { if (!alive) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; if (f(dt, t) !== false) id = requestAnimationFrame(loop); }; id = requestAnimationFrame(loop); cleans.push(() => cancelAnimationFrame(id)); },
    on(target, ev, f, opt) { target.addEventListener(ev, f, opt); cleans.push(() => target.removeEventListener(ev, f, opt)); },
    onClose(f) { cleans.push(f); },
    // Ergebnis-Overlay: {title, text, coins, again: true}
    finish(o = {}) {
      const box = h(`<div class="over"><div class="box"><h2>${o.title || 'Fertig!'}</h2><div class="muted">${o.text || ''}</div>
        <div class="gain">${o.coins ? '+' + fmt(o.coins) + ' 🪙' : o.coins === 0 ? '<span class="muted" style="font-size:15px">keine Coins diesmal</span>' : ''}</div>
        <div class="rowc"><button class="btn main" type="button" data-a="again">⟳ Nochmal</button><button class="btn" type="button" data-a="back">← Galerie</button></div></div></div>`);
      box.addEventListener('click', (e) => { const a = e.target.dataset.a; if (a === 'again') hooks.restart(); if (a === 'back') hooks.back(); });
      root.appendChild(box);
    },
    // Spielkarte als HTML ({r: 2..14, s: 's'|'h'|'d'|'c'})
    cardHtml(c, cls = '') {
      if (!c) return `<div class="pc back ${cls}" style="--cb:${cardBack()}"></div>`;
      const R = { 11: 'B', 12: 'D', 13: 'K', 14: 'A' }[c.r] || String(c.r), S = { s: '♠', h: '♥', d: '♦', c: '♣' }[c.s];
      return `<div class="pc ${cls} ${c.s === 'h' || c.s === 'd' ? 'red' : ''}"><div class="r">${R}${S}</div><div class="c">${S}</div><div class="r rb">${R}${S}</div></div>`;
    },
    // Canvas mit fester logischer Größe (W×H), passt sich der Bühne an, scharf auf Retina
    canvas(W, H, host) {
      const cv = document.createElement('canvas'), g = cv.getContext('2d');
      const fit = () => {
        const st = $('#stage'), aw = Math.min(st.clientWidth - 20, 760), ah = st.clientHeight - 90;
        const s = Math.max(0.3, Math.min(aw / W, ah / H)), dpr = Math.min(2, window.devicePixelRatio || 1);
        cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
        cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); g.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
      };
      (host || root).appendChild(cv); fit(); api.on(window, 'resize', fit);
      cv.style.borderRadius = '14px'; cv.style.border = '1px solid #3a2e20'; cv.style.margin = '0 auto';
      return { cv, g, W, H, fit };
    },
    deck(n = 1) { const d = []; for (let k = 0; k < n; k++) for (const s of 'shdc') for (let r = 2; r <= 14; r++) d.push({ r, s }); return shuffle(d); },
  };
  api._close = () => { alive = false; for (const f of cleans.splice(0)) try { f(); } catch (e) { console.error(e); } };
  return api;
}

// Stammtisch 21: Blackjack gegen den Dealer mit Coin-Einsatz.
MG.register({
  id: 'bj', title: 'Stammtisch 21', icon: '🂡', bg: ['#14532d', '#05200f'], cat: 'karten', players: '1',
  desc: 'Blackjack gegen den Dealer. Setz deine Coins – 21 schlägt alles.', added: '2026-11-03', pop: 84,
  tags: ['blackjack', 'karten', 'einsatz', 'casino', '21'], unit: 'Gewinn',
  help: '<p>Komm näher an <b>21</b> als der Dealer, ohne drüber zu gehen. Bildkarten zählen 10, Ass 1 oder 11. Der Dealer zieht bis 17.</p><p><b>Karte</b> = ziehen · <b>Stehen</b> = aufhören · <b>Verdoppeln</b> = Einsatz ×2, genau eine Karte. Sieg zahlt 1:1, Blackjack (Ass + 10 mit den ersten 2 Karten) 3:2. Der Einsatz kommt aus deinen 🪙 – Gewinne zählen zum Tageslimit.</p>',
  mount(root, api) {
    let deck = api.deck(4), bet = 10, P = [], Dl = [], stake = 0, phase = 'bet', net = 0;
    const val = (h) => { let s = 0, a = 0; for (const c of h) { s += c.r === 14 ? 11 : Math.min(10, c.r); if (c.r === 14) a++; } while (s > 21 && a) { s -= 10; a--; } return s; };
    const draw1 = () => { if (deck.length < 15) deck = api.deck(4); return deck.pop(); };
    root.innerHTML = `<style>.bjt{background:${(SKIN[Wallet.d.equip.felt] || {}).bg || 'radial-gradient(#1f7a4a,#0d3d24)'};border:8px solid #5a3b1c;border-radius:120px/60px;padding:20px 14px;width:100%;max-width:560px;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
      .hand{display:flex;gap:6px;justify-content:center;min-height:88px;flex-wrap:wrap}.lbl{font-size:13px;color:#e8ffe8;margin:4px 0;text-align:center;font-weight:700}</style>
      <div class="gm center"><div class="hud"><span>Guthaben <b id="bj_c">0</b> 🪙</span><span>Heute <b id="bj_n">±0</b></span><span>Bester Gewinn <b>${api.best() || 0}</b></span></div>
      <div class="bjt"><div class="lbl" id="bj_dl">Dealer</div><div class="hand" id="bj_d"></div><div class="msg" id="bj_m" style="margin:10px 0;color:#fff"></div><div class="hand" id="bj_p"></div><div class="lbl" id="bj_pl">Du</div></div>
      <div class="rowc" id="bj_bet"><span class="muted" style="align-self:center">Einsatz:</span>${[10, 25, 50, 100].map((v) => `<button class="btn" data-b="${v}" type="button">${v}</button>`).join('')}<button class="btn main big" id="bj_deal" type="button">Austeilen</button></div>
      <div class="rowc" id="bj_act" hidden><button class="btn green big" id="bj_hit" type="button">➕ Karte</button><button class="btn red big" id="bj_st" type="button">✋ Stehen</button><button class="btn big" id="bj_dbl" type="button">×2 Verdoppeln</button></div></div>`;
    const show = (hide) => {
      $('#bj_d', root).innerHTML = Dl.map((c, i) => api.cardHtml(hide && i === 1 ? null : c, 'deal')).join('');
      $('#bj_p', root).innerHTML = P.map((c) => api.cardHtml(c, 'deal')).join('');
      $('#bj_dl', root).textContent = Dl.length ? 'Dealer ' + (hide ? '?' : val(Dl)) : 'Dealer';
      $('#bj_pl', root).textContent = P.length ? 'Du: ' + val(P) + (stake ? ' · Einsatz ' + stake + ' 🪙' : '') : 'Du';
      $('#bj_c', root).textContent = fmt(api.coins()); $('#bj_n', root).textContent = (net > 0 ? '+' : net < 0 ? '−' : '±') + Math.abs(net);
      $('#bj_bet', root).hidden = phase !== 'bet'; $('#bj_act', root).hidden = phase !== 'play';
      $('#bj_dbl', root).disabled = P.length !== 2 || api.coins() < stake;
      for (const b of $$('[data-b]', root)) b.classList.toggle('main', +b.dataset.b === bet);
    };
    const settle = (res) => {
      phase = 'bet'; api.played();
      let back = 0, prof = 0, txt;
      if (res === 'bj') { back = stake; prof = Math.floor(stake * 1.5); txt = '🂡 BLACKJACK!'; }
      else if (res === 'win') { back = stake; prof = stake; txt = '🏆 Gewonnen!'; }
      else if (res === 'push') { back = stake; txt = '🤝 Unentschieden – Einsatz zurück'; }
      else txt = res === 'bust' ? '💥 Über 21 – verloren' : '🤵 Dealer gewinnt';
      if (back) api.refund(back, 'Stammtisch 21 Einsatz zurück');
      const got = prof ? api.reward(prof, 'Stammtisch 21 Gewinn') : 0;
      net += got - (back ? 0 : stake);
      if (got) api.score(Math.max(api.best() || 0, got));
      api.sfx(prof ? 'win' : back ? 'click' : 'lose');
      $('#bj_m', root).innerHTML = txt + (got ? ` <b style="color:#ffd166">+${got} 🪙</b>` : res === 'push' ? '' : ` <span style="opacity:.8">−${stake} 🪙</span>`);
      stake = 0; show(false);
    };
    const dealerPlay = () => {
      phase = 'dealer'; show(false);
      const loop = () => {
        if (val(Dl) < 17) { Dl.push(draw1()); api.sfx('flip'); show(false); api.timeout(loop, 550); return; }
        const p = val(P), d = val(Dl);
        settle(d > 21 || p > d ? 'win' : p === d ? 'push' : 'lose');
      };
      api.timeout(loop, 500);
    };
    $('#bj_bet', root).onclick = (e) => { const b = e.target.dataset.b; if (b) { bet = +b; api.sfx('click'); show(false); } };
    $('#bj_deal', root).onclick = () => {
      if (api.coins() < bet) { toast('Nicht genug 🪙 – spiel andere MiniGames oder tausche Sats/Chips in der Wechselstube.'); return; }
      api.spend(bet, 'Stammtisch 21 Einsatz', 'new'); stake = bet; P = [draw1(), draw1()]; Dl = [draw1(), draw1()]; phase = 'play'; api.sfx('flip');
      $('#bj_m', root).textContent = '';
      show(true);
      if (val(P) === 21) { phase = 'dealer'; show(false); api.timeout(() => settle(val(Dl) === 21 ? 'push' : 'bj'), 600); }
    };
    $('#bj_hit', root).onclick = () => { if (phase !== 'play') return; P.push(draw1()); api.sfx('flip'); show(true); if (val(P) > 21) { phase = 'dealer'; show(false); api.timeout(() => settle('bust'), 500); } else if (val(P) === 21) dealerPlay(); };
    $('#bj_st', root).onclick = () => { if (phase === 'play') dealerPlay(); };
    $('#bj_dbl', root).onclick = () => {
      if (phase !== 'play' || P.length !== 2 || !api.spend(stake, 'Stammtisch 21 Verdoppeln', 'add')) return;
      stake *= 2; P.push(draw1()); api.sfx('flip'); show(true);
      if (val(P) > 21) { phase = 'dealer'; show(false); api.timeout(() => settle('bust'), 500); } else dealerPlay();
    };
    $('#bj_m', root).textContent = 'Einsatz wählen und austeilen!';
    show(false);
  },
});

// Bulle & Bär: 30 Sekunden Bullen antippen, Bären in Ruhe lassen (Hau-den-Maulwurf).
MG.register({
  id: 'bullbear', title: 'Bulle & Bär', icon: '🐂', bg: ['#8a5a00', '#2a1a00'], cat: 'geschick', players: '1',
  desc: '30 Sekunden: Tipp die Bullen weg, lass die Bären in Ruhe. Combos geben Extrapunkte!', added: '2026-11-03', pop: 86,
  tags: ['reaktion', 'tippen', 'whack a mole', 'schnell', 'handy'], unit: 'Punkte',
  help: '<p>Tippe auf jeden <b>🐂 Bullen</b>, der auftaucht (+1, mit Combo mehr). <b>🐋 Wale</b> geben +5. Wer einen <b>🐻 Bären</b> antippt, verliert 3 Punkte und die Combo.</p><p>Coins: Punkte ÷ 2 (max. 60).</p>',
  mount(root, api) {
    root.innerHTML = `<style>.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(90vw,380px)}
      .hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse at 50% 70%,#000 0 45%,#2a2219 46% 60%,#15110d 61%);border:0;position:relative;overflow:hidden;cursor:pointer;padding:0;font-size:clamp(40px,13vw,62px)}
      .hole span{position:absolute;left:0;right:0;bottom:-80%;transition:bottom .12s ease-out;pointer-events:none}.hole.up span{bottom:12%}.hole.hit{background:radial-gradient(ellipse at 50% 70%,#1d3b2c 0 45%,#2a2219 46% 60%,#15110d 61%)}
      .hole.ouch{background:radial-gradient(ellipse at 50% 70%,#5a1010 0 45%,#2a2219 46% 60%,#15110d 61%)}.tbar{width:min(90vw,380px);height:8px;background:#2a2219;border-radius:4px;overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,#3ecf8e,#f7931a,#ff5a5a)}</style>
      <div class="gm center"><div class="hud" id="bb_h"></div><div class="tbar"><i id="bb_t" style="width:100%"></i></div><div class="msg" id="bb_m">Tippe auf Start!</div>
      <div class="holes" id="bb_g">${Array.from({ length: 9 }, (_, i) => `<button type="button" class="hole" data-i="${i}" aria-label="Loch ${i + 1}"><span></span></button>`).join('')}</div>
      <button class="btn main big" id="bb_go" type="button">▶ Start</button></div>`;
    const holes = $$('.hole', root), DUR = 30;
    let S = { score: 0, combo: 0, t: 0, run: false, slots: Array(9).fill(null), spawn: 0 };
    const hud = () => { $('#bb_h', root).innerHTML = `<span>Punkte <b>${S.score}</b></span><span>Combo <b>×${1 + Math.floor(S.combo / 5)}</b></span><span>Rekord <b>${api.best() || 0}</b></span>`; };
    const setHole = (i, who) => { S.slots[i] = who; const el = holes[i]; el.classList.toggle('up', !!who); el.classList.remove('hit', 'ouch'); if (who) el.firstChild.textContent = { bull: '🐂', bear: '🐻', whale: '🐋' }[who.k]; };
    const end = () => {
      S.run = false; for (let i = 0; i < 9; i++) setHole(i, null); api.played();
      const rec = api.score(S.score), got = api.reward(clamp(Math.floor(S.score / 2), 0, 60), 'Bulle & Bär: ' + S.score);
      api.sfx('win'); api.finish({ title: S.score >= 60 ? '🐂 Bullrun!' : '⏱️ Zeit um!', text: `${S.score} Punkte${rec && S.score ? '<br>Neuer Rekord! 🏆' : ''}`, coins: got });
    };
    $('#bb_g', root).onpointerdown = (e) => {
      const b = e.target.closest('.hole'); if (!b || !S.run) return; const i = +b.dataset.i, w = S.slots[i]; if (!w) return;
      e.preventDefault(); setHole(i, null);
      if (w.k === 'bear') { S.score = Math.max(0, S.score - 3); S.combo = 0; b.classList.add('ouch'); api.sfx('bad'); $('#bb_m', root).textContent = pick(['🐻 Bärenfalle!', 'Autsch – Bär!', 'FUD! −3']); }
      else { S.combo++; const m = 1 + Math.floor(S.combo / 5); S.score += (w.k === 'whale' ? 5 : 1) * m; b.classList.add('hit'); api.sfx(w.k === 'whale' ? 'coin' : 'good'); if (S.combo % 5 === 0) $('#bb_m', root).textContent = `🔥 Combo ×${m}!`; }
      hud();
    };
    $('#bb_go', root).onclick = (e) => { e.target.hidden = true; S = { score: 0, combo: 0, t: 0, run: true, slots: Array(9).fill(null), spawn: 0.3 }; $('#bb_m', root).textContent = 'Los! 🐂'; hud(); };
    hud();
    api.raf((dt) => {
      if (!S.run) return;
      S.t += dt; $('#bb_t', root).style.width = Math.max(0, 100 - S.t / DUR * 100) + '%';
      if (S.t >= DUR) return end(), true;
      const life = Math.max(0.55, 1.15 - S.t * 0.02);
      for (let i = 0; i < 9; i++) { const w = S.slots[i]; if (w && (w.life -= dt) <= 0) { if (w.k !== 'bear') S.combo = 0; setHole(i, null); hud(); } }
      if ((S.spawn -= dt) <= 0) {
        S.spawn = Math.max(0.28, 0.7 - S.t * 0.014);
        const freeH = S.slots.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
        if (freeH.length) { const r = Math.random(); setHole(pick(freeH), { k: r < 0.06 ? 'whale' : r < 0.36 ? 'bear' : 'bull', life }); }
      }
    });
  },
});

// ---- games/highlow.js ----
// High-Low: Ist die nächste Karte höher oder niedriger? Serie aufbauen, rechtzeitig Kasse machen.
MG.register({
  id: 'highlow', title: 'High-Low', icon: '🃏', bg: ['#7a1f1f', '#2a0c0c'], cat: 'karten', players: '1',
  desc: 'Höher oder niedriger? Bau eine Serie auf und mach rechtzeitig Kasse.', added: '2026-11-03', pop: 88,
  tags: ['karten', 'glück', 'serie', 'schnell'], unit: 'Serie',
  help: '<p>Tippe, ob die nächste Karte <b>höher</b> oder <b>niedriger</b> ist (Ass ist hoch). Gleicher Wert = unentschieden, die Serie bleibt.</p><p>Jeder Treffer erhöht den Topf. Mit <b>Kasse machen</b> sicherst du die Coins – ein Fehler und der Topf ist weg!</p>',
  mount(root, api) {
    let deck = api.deck(), cur = deck.pop(), streak = 0, pot = 0, busy = false;
    const potFor = (s) => Math.round(2 * s * s / 3 + 2 * s); // 1:3 2:7 3:12 4:19 5:27 …
    root.innerHTML = `<div class="gm center">
      <div class="hud"><span>Serie <b id="hl_s">0</b></span><span>Topf <b id="hl_p">0</b> 🪙</span><span>Rekord <b>${api.best() || 0}</b></span></div>
      <div class="rowc" style="align-items:center;gap:22px"><div id="hl_cur"></div><div style="font-size:26px" class="muted">→</div><div id="hl_next"></div></div>
      <div class="msg" id="hl_m">Höher oder niedriger als die ${''}Karte links?</div>
      <div class="rowc"><button class="btn green big" id="hl_hi" type="button">▲ Höher</button><button class="btn red big" id="hl_lo" type="button">▼ Niedriger</button></div>
      <button class="btn main" id="hl_cash" type="button" disabled>💰 Kasse machen</button>
      <div class="muted" style="font-size:12px">Noch <span id="hl_left">${deck.length}</span> Karten im Stapel</div></div>`;
    const draw = (next) => {
      $('#hl_cur', root).innerHTML = api.cardHtml(cur, 'big deal');
      $('#hl_next', root).innerHTML = next ? api.cardHtml(next, 'big deal') : api.cardHtml(null, 'big');
      $('#hl_s', root).textContent = streak; $('#hl_p', root).textContent = pot; $('#hl_left', root).textContent = deck.length;
      $('#hl_cash', root).disabled = !pot || busy;
    };
    const end = (lost) => {
      busy = true; api.played();
      const rec = api.score(streak);
      const got = lost ? 0 : api.reward(pot, 'High-Low Serie ' + streak);
      api.finish({ title: lost ? '💥 Daneben!' : '💰 Kasse gemacht!', text: `Serie: <b>${streak}</b>${rec && streak ? ' – neuer Rekord! 🏆' : ''}${lost && pot ? `<br>Der Topf von ${pot} 🪙 ist weg.` : ''}`, coins: got });
    };
    const guess = (up) => {
      if (busy) return; busy = true; api.sfx('flip');
      if (!deck.length) deck = api.deck();
      const nx = deck.pop(); draw(nx);
      const ok = nx.r === cur.r ? null : (nx.r > cur.r) === up;
      api.timeout(() => {
        if (ok === false) { api.sfx('bad'); $('#hl_m', root).textContent = 'Leider falsch …'; return end(true); }
        if (ok) { streak++; pot = potFor(streak); api.sfx('good'); $('#hl_m', root).textContent = pick(['Treffer! 🚀', 'Bullish! 📈', 'Sauber!', 'Weiter so!']); }
        else $('#hl_m', root).textContent = 'Gleicher Wert – Serie bleibt.';
        cur = nx; busy = false; draw(null);
      }, 650);
    };
    $('#hl_hi', root).onclick = () => guess(true);
    $('#hl_lo', root).onclick = () => guess(false);
    $('#hl_cash', root).onclick = () => { if (!busy && pot) end(false); };
    api.on(window, 'keydown', (e) => { if (e.key === 'ArrowUp') guess(true); if (e.key === 'ArrowDown') guess(false); if (e.key === 'Enter' && pot) end(false); });
    draw(null);
  },
});

(() => {
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const dieHtml = (v, held, i, roll) => `<button type="button" class="die${held ? ' held' : ''}${roll ? ' roll' : ''}" data-i="${i}" aria-label="Würfel ${v}${held ? ', gehalten' : ''}">${Array.from({ length: 9 }, (_, k) => `<i${PIPS[v].includes(k) ? ' class="p"' : ''}></i>`).join('')}</button>`;

  .kt tfoot td{font-weight:800;border-top:2px solid #3a2e20}@media(max-width:560px){.die{width:48px;height:48px;padding:6px}}</style>`;
  const CATS_K = [
    ['dp', 'Dreierpasch', 'Summe aller Augen'], ['vp', 'Viererpasch', 'Summe aller Augen'], ['fh', 'Full House', '25'],
    ['ks', 'Kleine Straße', '30 (4 in Folge)'], ['gs', 'Große Straße', '40 (5 in Folge)'], ['kn', 'Kniffel', '50 (5 gleiche)'], ['ch', 'Chance', 'Summe aller Augen'],
  ];
  function scoreOf(cat, d) {
    const c = [0, 0, 0, 0, 0, 0, 0]; for (const v of d) c[v]++;
    const sum = d.reduce((a, b) => a + b, 0), mx = Math.max(...c), u = new Set(d);
    const run = (n) => { for (let s = 1; s <= 7 - n; s++) { let ok = true; for (let k = 0; k < n; k++) if (!u.has(s + k)) ok = false; if (ok) return true; } return false; };
    switch (cat) {
      case 'dp': return mx >= 3 ? sum : 0; case 'vp': return mx >= 4 ? sum : 0;
      case 'fh': return (c.includes(3) && c.includes(2)) || mx === 5 ? 25 : 0;
      case 'ks': return run(4) ? 30 : 0; case 'gs': return run(5) ? 40 : 0;
      case 'kn': return mx === 5 ? 50 : 0; case 'ch': return sum;
    }
    return 0;
  }
  // Bot: hält die häufigste Zahl (oder baut auf eine Straße), wählt am Ende die beste freie Kategorie
  function botHold(d, free) {
    const c = [0, 0, 0, 0, 0, 0, 0]; for (const v of d) c[v]++;
    const u = [...new Set(d)].sort();
    const wantStraight = (free.has('gs') || free.has('ks')) && u.length >= 4;

    let best = 6; for (let v = 6; v >= 1; v--) if (c[v] > c[best]) best = v;
    return d.map((v) => v === best);
  }
  function botPick(d, free) {

    for (const k of free) { let s = scoreOf(k, d); if (k === 'ch') s -= 12; if (s > bs) { bs = s; bc = k; } }

        <div class="msg" id="kn_m">Du bist dran – würfeln!</div>

        <tfoot><tr><td>Summe</td><td class="n" id="kn_sm">0</td><td class="n" id="kn_sb">0</td></tr></tfoot></table></div>`;
      const free = (who) => new Set(CATS_K.map((c) => c[0]).filter((k) => S[who][k] === undefined));

(() => {
  const NAMES = ['High Card', 'Ein Paar', 'Zwei Paare', 'Drilling', 'Straße', 'Flush', 'Full House', 'Vierling', 'Straight Flush'];
  function eval5(cs) {
    const rs = cs.map((c) => c.r).sort((a, b) => b - a), cnt = {};
    for (const r of rs) cnt[r] = (cnt[r] || 0) + 1;
    const groups = Object.entries(cnt).map(([r, n]) => [n, +r]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
    const flush = cs.every((c) => c.s === cs[0].s);
    const u = [...new Set(rs)]; let st = 0;
    if (u.length === 5) { if (u[0] - u[4] === 4) st = u[0]; else if (u[0] === 14 && u[1] === 5) st = 5; }
    let cat, kick;
    if (st && flush) { cat = 8; kick = [st]; }
    else if (groups[0][0] === 4) { cat = 7; kick = groups.map((g) => g[1]); }
    else if (groups[0][0] === 3 && groups[1][0] === 2) { cat = 6; kick = groups.map((g) => g[1]); }
    else if (flush) { cat = 5; kick = rs; }
    else if (st) { cat = 4; kick = [st]; }
    else if (groups[0][0] === 3) { cat = 3; kick = groups.map((g) => g[1]); }
    else if (groups[0][0] === 2 && groups[1][0] === 2) { cat = 2; kick = groups.map((g) => g[1]); }
    else if (groups[0][0] === 2) { cat = 1; kick = groups.map((g) => g[1]); }
    else { cat = 0; kick = rs; }
    let v = cat; for (let i = 0; i < 5; i++) v = v * 15 + (kick[i] || 0);
    return v;
  }
  function best7(cs) { let b = -1; for (let a = 0; a < 7; a++) for (let c = a + 1; c < 7; c++) { const five = cs.filter((_, i) => i !== a && i !== c); b = Math.max(b, eval5(five)); } return b; }
  const catOf = (v) => NAMES[Math.floor(v / 759375)];
  window.__pokerEval = { eval5, best7, catOf }; // für Tests

        <div class="gm center"><div class="hud" id="sd_h"></div><div class="tbar"><i id="sd_t" style="width:100%"></i></div>
        <div class="msg" id="sd_m">Wer gewinnt?</div>
        <div class="sdr" id="sd_b"></div>
        <div class="rowc" style="gap:16px"><div class="sdh" data-a="A" id="sd_A"><b>Hand A</b><div class="sdr"></div><small class="muted"></small></div><div class="sdh" data-a="B" id="sd_B"><b>Hand B</b><div class="sdr"></div><small class="muted"></small></div></div>
        <div class="rowc"><button class="btn big" data-a="A" type="button">⬅ Hand A</button><button class="btn big" data-a="S" type="button">🤝 Split</button><button class="btn big" data-a="B" type="button">Hand B ➡</button></div>

      const deal = () => {

    api.on(window, 'keydown', (e) => { const m = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R' }[e.key]; if (m) { e.preventDefault(); turn(m); } });

    });
  },

  mount(root, api) {

    const win = (b) => { for (const l of L) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { p: b[l[0]], l }; return b.every(Boolean) ? { p: 0 } : null; };
    function mm(b, me, turn, depth) {
      const w = win(b); if (w) return w.p === me ? 10 - depth : w.p ? depth - 10 : 0;
      let best = turn === me ? -99 : 99;
      for (let i = 0; i < 9; i++) if (!b[i]) { b[i] = turn; const s = mm(b, me, turn === 1 ? 2 : 1, depth + 1); b[i] = 0; best = turn === me ? Math.max(best, s) : Math.min(best, s); }
      return best;
    }
    const botMove = (b, lvl) => {
      const free = b.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
      if (lvl === 0 && Math.random() < 0.6) return pick(free);

      };
      const check = () => {
        const w = win(b); if (!w) return false; over = true; draw(w.l); api.played();
        let coins = 0, title;
        if (lvl === 9) title = w.p ? sym[w.p] + ' gewinnt!' : '🤝 Unentschieden';
        else if (w.p === 1) { title = '🐂 Du gewinnst!'; coins = [4, 12, 0][lvl]; api.score((api.best() || 0) + 1); api.sfx('win'); }

        api.timeout(() => api.finish({ title, coins: lvl === 9 ? undefined : got }), 700);
        return true;
      };
      $('#tt_b', root).onclick = (e) => {
        const i = +e.target.dataset.i; if (over || isNaN(i) || b[i] || (lvl !== 9 && turn !== 1)) return;

    };

  },
});

      const ec = c + dc * 3, er = r + dr * 3; if (ec < 0 || ec >= W || er < 0 || er >= H) continue;

      let s = 0;

      for (const l of lines) { let a = 0, o = 0; for (const i of l) { if (b[i] === 2) a++; else if (b[i] === 1) o++; } if (a && o) continue; if (a === 3) s += 5; else if (a === 2) s += 2; if (o === 3) s -= 6; else if (o === 2) s -= 2; }

// Tägliches Glücksrad: einmal am Tag gratis drehen, danach für 30 🪙.
MG.register({
  id: 'wheel', title: 'Tägliches Glücksrad', icon: '🎡', bg: ['#9b1f6b', '#2a0820'], cat: 'casual', players: '1',
  desc: 'Einmal am Tag gratis drehen – bis zu 200 🪙 Jackpot!', added: '2026-11-03', pop: 95,
  tags: ['glück', 'täglich', 'bonus', 'gratis', 'daily'], best: null, unit: '',
  help: '<p>Jeden Tag gibt es <b>einen Gratis-Dreh</b>. Weitere Drehungen kosten 30 🪙. Die Feldgröße zeigt die echte Wahrscheinlichkeit.</p>',
  mount(root, api) {
    const SEG = [[5, 20, '#3a2e20'], [10, 20, '#5a3b1c'], [15, 15, '#2a7a5a'], [20, 15, '#1f5a9b'], [25, 12, '#6b2fa8'], [50, 10, '#b85f05'], [100, 6, '#e04040'], [200, 2, '#f2b33d']];
    const TOT = SEG.reduce((a, s) => a + s[1], 0);
    let ang = 0, spin = null;
    root.innerHTML = '<div class="gm center"><div class="hud" id="wh_h"></div><div id="wh_c" style="position:relative"></div><div class="msg" id="wh_m"></div><button class="btn main big" id="wh_go" type="button"></button></div>';
    const { g, W, H } = api.canvas(360, 360, $('#wh_c', root));
    const freeToday = () => Wallet.d.spin !== today();
    const ui = () => { $('#wh_go', root).textContent = freeToday() ? '🎁 Gratis drehen' : '🎡 Drehen (30 🪙)'; $('#wh_go', root).disabled = !!spin; $('#wh_h', root).innerHTML = `<span>Guthaben <b>${fmt(api.coins())}</b> 🪙</span><span>${freeToday() ? 'Gratis-Dreh verfügbar ✨' : 'Gratis-Dreh morgen wieder'}</span>`; };
    const draw = () => {
      const cx = W / 2, cy = H / 2, R = 160; g.clearRect(0, 0, W, H);
      let a = ang;
      for (const [v, w, col] of SEG) {
        const da = w / TOT * Math.PI * 2;
        g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, a, a + da); g.closePath(); g.fillStyle = col; g.fill(); g.strokeStyle = '#0b0907'; g.lineWidth = 2; g.stroke();
        g.save(); g.translate(cx, cy); g.rotate(a + da / 2); g.fillStyle = v === 200 ? '#1a0e00' : '#fff'; g.font = `bold ${da > 0.5 ? 20 : 14}px system-ui`; g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText(v, R - 12, 0); g.restore();
        a += da;
      }
      g.beginPath(); g.arc(cx, cy, 26, 0, Math.PI * 2); g.fillStyle = '#f7931a'; g.fill(); g.fillStyle = '#fff'; g.font = 'bold 22px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('₿', cx, cy + 1);
      g.beginPath(); g.moveTo(cx - 12, 4); g.lineTo(cx + 12, 4); g.lineTo(cx, 30); g.closePath(); g.fillStyle = '#fff'; g.fill(); g.strokeStyle = '#0b0907'; g.stroke();
    };
    const result = () => { // Feld unter dem Zeiger (oben = −90°)
      let p = ((-Math.PI / 2 - ang) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2), acc = 0;
      for (const s of SEG) { acc += s[1] / TOT * Math.PI * 2; if (p < acc) return s[0]; }
      return SEG[0][0];
    };
    $('#wh_go', root).onclick = () => {
      if (spin) return;
      if (freeToday()) Wallet.op({ op: 'spin' });
      else if (!api.spend(30, 'Glücksrad-Dreh')) { toast('Nicht genug 🪙 für einen weiteren Dreh.'); return; }
      spin = { v: 18 + Math.random() * 8, last: -1 }; $('#wh_m', root).textContent = 'Dreht …'; ui();
    };
    ui(); draw();
    api.raf((dt) => {
      if (!spin) return;
      ang += spin.v * dt; spin.v *= Math.pow(0.45, dt); const seg = result(); if (seg !== spin.last) { spin.last = seg; api.sfx('tick'); }
      draw();
      if (spin.v < 0.15) {
        const v = result(); spin = null; api.played();
        const got = api.reward(v, 'Glücksrad');
        api.sfx(v >= 100 ? 'win' : 'good'); $('#wh_m', root).innerHTML = v >= 200 ? `🎉 JACKPOT! <b style="color:#f2b33d">+${got} 🪙</b>` : `Du gewinnst <b style="color:#f2b33d">+${got} 🪙</b>`; ui();
      }
    });
  },
});

        <div class="xrow" style="justify-content:space-between"><div><div class="rate">${per} ${CUR[cur].sym} = ${(r * per).toFixed(2).replace('.', ',')} 🪙</div><div class="${ch >= 0 ? 'up' : 'dn'}" style="font-size:13px;font-weight:700">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(1).replace('.', ',')} % zu gestern</div></div>${this.spark(wk, ch >= 0 ? '#3ecf8e' : '#ff5a5a')}</div>
        <div class="muted" style="font-size:13px">Der Kurs ändert sich jeden Tag (±15 %) – wer HODLt und am richtigen Tag tauscht, bekommt mehr. 📈</div>
        <div class="xrow"><input type="range" min="0" max="${d[cur]}" step="1" value="${d[cur]}" data-x="${cur}" ${d[cur] ? '' : 'disabled'} aria-label="Menge"><b class="rate" id="xv_${cur}"></b></div>
        <button class="btn main" type="button" data-go="${cur}" ${d[cur] ? '' : 'disabled'}>💱 Tauschen</button> <span class="muted" style="font-size:13px">Du hast ${fmt(d[cur])} ${CUR[cur].sym}</span></div>`;
    };
    m.appendChild(h(`<div class="cols">${xcard('sats')}${xcard('chips')}
      <div class="card"><h2>SO VERDIENST DU ⚡ UND ♠</h2><ul class="howto" style="padding-left:18px;margin:0">
        <li><b>🏎️ Kart-Rennen:</b> Nach jedem Rennen gibt es ⚡ Sats je nach Platz (1. Platz 30 ⚡ … letzter 3 ⚡) + die eingesammelten Sats. Cup-Sieg = +50 ⚡.</li>
        <li><b>♠ Pokerabend:</b> Jede gewonnene Hand bringt Bonus-Chips (10 % vom Pot, max. 2 000 ♠), ein Turniersieg +5 000 ♠. Deine Tisch-Chips bleiben dabei unangetastet.</li>
        <li><b>🎮 MiniGames:</b> direkt 🪙 Guru-Coins, bis ${DAY_CAP} pro Tag (heute ${fmt(d.dayEarn)}).</li></ul>
        <p class="muted" style="font-size:12.5px;margin-bottom:0">Gutschriften kommen nur an, wenn du Kart bzw. Poker über die Hauptseite (Reiter oben) spielst. Pro Tag höchstens 1 000 ⚡ und 50 000 ♠. Mit Konto landet alles automatisch im Konto.</p>
        ${PARAMS.has('demo') ? '<button class="btn sm" type="button" id="demo">🧪 Test: +100 ⚡ und +5 000 ♠</button>' : ''}</div>
      <div class="card"><h2>VERLAUF</h2><div class="log">${d.log.map((l) => `<div><span class="muted">${new Date(l.t).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })}</span><span>${esc(l.why)}</span><span class="${l.n >= 0 ? 'up' : 'dn'}">${l.n >= 0 ? '+' : '−'}${fmt(Math.abs(l.n))} ${CUR[l.cur].sym}</span></div>`).join('') || '<div class="muted">Noch nichts passiert.</div>'}</div></div></div>`));
    const upd = (cur) => { const r = $(`[data-x="${cur}"]`), n = +r.value; $('#xv_' + cur).textContent = `${fmt(n)} ${CUR[cur].sym} → ${fmt(Math.floor(n * Rates.of(cur)))} 🪙`; };
    for (const r of $$('[data-x]')) { r.oninput = () => upd(r.dataset.x); upd(r.dataset.x); }
    m.onclick = (e) => {
      const go = e.target.dataset.go;
      if (go) {
        const n = +$(`[data-x="${go}"]`).value, r = Wallet.op({ op: 'exchange', cur: go, n });
        if (!r.ok) { toast('Zu wenig für 1 🪙 – Regler weiter nach rechts.'); return; }
        Sound.fx('coin'); toast(`💱 +${fmt(r.got)} 🪙 eingetauscht`); this.pills(true); this.render();
      }
      if (e.target.id === 'demo') { Wallet.credit('sats', 100, 'Test-Gutschrift Kart'); Wallet.credit('chips', 5000, 'Test-Gutschrift Poker'); }
    };
  },
  // ---------- Konto & Profil ----------
  me(m) {
    const d = Wallet.d, fr = SKIN[d.equip.frame], tt = SKIN[d.equip.title], A = Account;
    const nm = A.on ? A.s.name : playerName();
    const eqList = Object.entries(SLOTS).map(([k, v]) => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #241c14"><span class="muted">${v}</span><b>${d.equip[k] ? esc(SKIN[d.equip[k]].name) : '–'}</b></div>`).join('');
    m.appendChild(h(`<div class="cols">
      <div class="card" id="accCard"></div>
      <div class="card" style="text-align:center"><div class="frame" style="margin:6px auto 12px;width:86px;height:86px;font-size:42px;${fr ? `box-shadow:0 0 0 5px ${fr.ring},0 0 22px ${fr.ring}` : 'box-shadow:0 0 0 3px #3a2e20'}">${fr ? fr.icon : '🙂'}</div>
        <h2 style="font-size:20px;color:var(--txt);letter-spacing:0">${esc(nm)}${A.on || nm === 'Gast' ? '' : ' <span class="muted" style="font-size:13px">(Gast)</span>'}</h2>${tt ? `<div class="ttl r${tt.rar}" style="display:inline-block;margin-top:6px">${esc(tt.txt)}</div>` : '<div class="muted" style="margin-top:6px">Noch kein Titel – im Shop gibt\'s welche.</div>'}
        <div class="rowc" style="margin-top:12px"><span class="pill c">🪙 ${fmt(d.coins)}</span><span class="pill">🕹️ ${fmt(d.stats.games)} Spiele</span><span class="pill">💰 ${fmt(d.stats.earned)} verdient</span><span class="pill">🎒 ${Object.keys(d.owned).length}/${SKINS.length} Skins</span></div></div>
      <div class="card"><h2>DEINE REKORDE</h2>${MG.games.filter((g) => g.best).map((g) => `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #241c14"><span>${g.icon} ${esc(g.title)}</span><b>${d.hs[g.id] !== undefined ? fmt(d.hs[g.id]) + ' ' + g.unit : '<span class="muted">–</span>'}</b></div>`).join('')}</div>
      <div class="card"><h2>ANGELEGT</h2>${eqList}<div style="margin-top:12px"><button class="btn sm" type="button" id="wipe">🗑️ ${A.on ? 'Fortschritt im Konto zurücksetzen' : 'Gast-Daten zurücksetzen'}</button></div></div></div>`));
    $('#wipe').onclick = (e) => {
      const b = e.target;
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = '⚠️ Wirklich alles löschen? Nochmal klicken'; return; }
      Wallet.op({ op: 'wipe' }); toast('Zurückgesetzt – 100 🪙 Startbonus.'); this.render();
    };
    this.accCard($('#accCard'));
  },
  accMode: 'login',
  accCard(el) {
    const A = Account, inp = (id, label, type, ac, extra = '') => `<label class="fld"><span>${label}</span><input id="${id}" type="${type}" autocomplete="${ac}" ${extra}></label>`;
    const style = `<style>.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px;color:var(--mut)}.fld input{background:#0f0c09;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}.fld input:focus{outline:0;border-color:var(--gold)}
      .acctabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.acctabs button{appearance:none;border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}.acctabs button.on{border-color:var(--gold);color:var(--gold)}
      .err{color:var(--red);font-weight:600;min-height:18px;font-size:13px}.okm{color:var(--green);font-weight:600;font-size:13px}</style>`;
    if (!A.ready) {
      el.innerHTML = style + `<h2>👤 KONTO</h2><p>Mit einem Konto (Name + Passwort, E-Mail freiwillig) liegen deine Coins, Skins und Rekorde sicher auf dem Server – auf jedem Gerät gleich, und bereit für die Discord-Bestenliste.</p><p class="muted">Der Konto-Server wird gerade eingerichtet – bis dahin spielst du als Gast in diesem Browser. Dein Gast-Fortschritt wird beim Registrieren übernommen.</p>`;
      return;
    }
    if (A.on) {
      el.innerHTML = style + `<h2>👤 DEIN KONTO</h2>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">Name</span><b>${esc(A.s.name)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">E-Mail</span><b>${A.s.email ? esc(A.s.email) : '<span class="muted">keine</span>'}</b></div>
        <p class="muted" style="font-size:12.5px">Coins, Skins und Rekorde werden automatisch gespeichert und sind auf jedem Gerät gleich, auf dem du dich einloggst.</p>
        <div class="rowc" style="justify-content:flex-start"><button class="btn sm" data-m="email" type="button">✉️ E-Mail ${A.s.email ? 'ändern' : 'hinzufügen'}</button><button class="btn sm" data-m="pw" type="button">🔑 Passwort ändern</button><button class="btn sm" id="accOut" type="button">🚪 Abmelden</button><button class="btn sm" data-m="del" type="button">🗑️ Konto löschen</button></div>
        <form id="accForm" hidden></form><div class="err" id="accErr"></div>`;
      $('#accOut', el).onclick = async () => { await A.logout(); toast('Abgemeldet – du spielst wieder als Gast.'); this.pills(); this.render(); };
      el.onclick = (e) => {
        const md = e.target.dataset.m; if (!md) return;
        const f = $('#accForm', el); f.hidden = false; f.dataset.m = md; $('#accErr', el).textContent = '';
        f.innerHTML = {
          email: inp('a_email', 'Neue E-Mail (leer lassen = entfernen)', 'email', 'email', `value="${esc(A.s.email)}"`) + inp('a_pw', 'Dein Passwort zur Bestätigung', 'password', 'current-password', 'required'),
          pw: inp('a_pw', 'Altes Passwort', 'password', 'current-password', 'required') + inp('a_npw', 'Neues Passwort (mind. 6 Zeichen)', 'password', 'new-password', 'required minlength="6"'),
          del: '<p class="err" style="margin:6px 0">Das Konto und alle Coins, Skins und Rekorde werden endgültig gelöscht.</p>' + inp('a_pw', 'Passwort zur Bestätigung', 'password', 'current-password', 'required'),
        }[md] + `<button class="btn ${md === 'del' ? 'red' : 'main'}" type="submit">${md === 'del' ? 'Endgültig löschen' : 'Speichern'}</button>`;
        f.onsubmit = (ev) => { ev.preventDefault(); this.accSubmit(md, el); };
      };
      return;
    }
    const mode = this.accMode;
    el.innerHTML = style + `<h2>👤 KONTO</h2><div class="acctabs"><button type="button" data-t="login" class="${mode === 'login' ? 'on' : ''}">Einloggen</button><button type="button" data-t="reg" class="${mode === 'reg' ? 'on' : ''}">Registrieren</button><button type="button" data-t="forgot" class="${mode.startsWith('forgot') ? 'on' : ''}">Passwort vergessen</button></div>
      <form id="accForm" autocomplete="on">${{
        login: inp('a_id', 'Name oder E-Mail', 'text', 'username', 'required maxlength="80"') + inp('a_pw', 'Passwort', 'password', 'current-password', 'required') + '<button class="btn main" type="submit">Einloggen</button>',
        reg: inp('a_name', 'Name (2–18 Zeichen, so sehen dich die anderen)', 'text', 'username', 'required minlength="2" maxlength="18"') + inp('a_pw', 'Passwort (mind. 6 Zeichen)', 'password', 'new-password', 'required minlength="6"') + inp('a_pw2', 'Passwort wiederholen', 'password', 'new-password', 'required minlength="6"') + inp('a_email', 'E-Mail (freiwillig – nur fürs Zurücksetzen des Passworts)', 'email', 'email', 'maxlength="80"')
          + `<p class="muted" style="font-size:12px;margin:4px 0 10px">Dein Gast-Fortschritt in diesem Browser (Coins bis 1 500, Skins, Rekorde) wird ins Konto übernommen. Die E-Mail wird nur fürs Passwort-Zurücksetzen gespeichert und nirgends angezeigt.</p><button class="btn main" type="submit">Konto erstellen</button>`,
        forgot: inp('a_id', 'Name oder E-Mail', 'text', 'username', 'required') + '<p class="muted" style="font-size:12px">Geht nur, wenn im Konto eine E-Mail hinterlegt ist. Du bekommst einen 6-stelligen Code.</p><button class="btn main" type="submit">Code schicken</button>',
        forgot2: `<p class="okm">Falls eine E-Mail hinterlegt ist, ist der Code unterwegs (Spam-Ordner prüfen).</p>` + inp('a_code', 'Code aus der E-Mail', 'text', 'one-time-code', 'required inputmode="numeric" maxlength="6"') + inp('a_npw', 'Neues Passwort (mind. 6 Zeichen)', 'password', 'new-password', 'required minlength="6"') + '<button class="btn main" type="submit">Passwort setzen</button>',
      }[mode]}</form><div class="err" id="accErr"></div>`;
    $('.acctabs', el).onclick = (e) => { const t = e.target.dataset.t; if (t) { this.accMode = t; this.accCard(el); } };
    $('#accForm', el).onsubmit = (ev) => { ev.preventDefault(); this.accSubmit(mode, el); };
  },
  async accSubmit(mode, el) {
    const A = Account, v = (id) => { const x = $('#' + id, el); return x ? x.value.trim() : ''; }, pwv = (id) => { const x = $('#' + id, el); return x ? x.value : ''; };
    const err = $('#accErr', el), btn = $('#accForm button[type=submit]', el);
    err.textContent = ''; btn.disabled = true; const old = btn.textContent; btn.textContent = '⏳ …';
    try {
      let r;
      if (mode === 'login') r = await A.login(v('a_id'), pwv('a_pw'));
      else if (mode === 'reg') {
        if (pwv('a_pw') !== pwv('a_pw2')) throw new Error('Die beiden Passwörter sind nicht gleich.');
        r = await A.register(v('a_name'), pwv('a_pw'), v('a_email'));
      } else if (mode === 'forgot') { this.accId = v('a_id'); r = await A.call('resetReq', { id: this.accId }); if (r.ok) { this.accMode = 'forgot2'; this.accCard(el); return; } }
      else if (mode === 'forgot2') { r = await A.call('resetDo', { id: this.accId, code: v('a_code'), npw: pwv('a_npw') }); if (r.ok) { A.stashGuest(); A.setSession(r); } }
      else if (mode === 'email') { r = await A.call('setEmail', { token: A.s.token, pw: pwv('a_pw'), email: v('a_email') }); if (r.ok) { A.s.email = r.user.email || ''; ls.set(SKEY, A.s); } }
      else if (mode === 'pw') r = await A.call('changePw', { token: A.s.token, pw: pwv('a_pw'), npw: pwv('a_npw') });
      else if (mode === 'del') { r = await A.call('delete', { token: A.s.token, pw: pwv('a_pw') }); if (r.ok) { A.s = null; ls.set(SKEY, null); A.lost('Konto gelöscht.'); } }
      if (!r || !r.ok) throw new Error((r && r.msg) || 'Das hat nicht geklappt.');
      Sound.fx('good');
      toast({ login: `Willkommen zurück, ${esc(A.s && A.s.name)}! 👋`, reg: `Konto „${esc(A.s && A.s.name)}“ erstellt! 🎉`, forgot2: 'Neues Passwort gesetzt – du bist eingeloggt.', email: 'E-Mail gespeichert.', pw: 'Passwort geändert.', del: 'Konto gelöscht.' }[mode] || 'Erledigt.');
      this.accMode = 'login'; this.pills(); this.render();
    } catch (e) { err.textContent = e.message; Sound.fx('bad'); btn.disabled = false; btn.textContent = old; }
  },
};
UI.init();
Account.refresh();
window.MG = MG; window.Wallet = Wallet; window.UI = UI; window.Account = Account; // für Tests und künftige Erweiterungen

</script>
</body>
</html>
