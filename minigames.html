  },
  mySeat() { return this.seatOf(this.myId); },
  // Host weg: kurz melden, dann übernimmt der erste verbleibende Mitspieler den Raum, die anderen verbinden sich neu (wie im Kart)
  lostHost(why) {
    if (this.isHost || this.st !== 'on') return;
    const old = this.L, hostName = old ? (old.players.find((p) => p.id === old.hostId) || {}).name : '';
    const others = old ? old.players.filter((p) => p.id !== old.hostId) : [];
    const rank = Math.max(0, others.findIndex((p) => p.id === this.myId));
    const wasPlaying = !!(this.play && old && old.phase === 'play' && !old.done && this.mySeat() >= 0);
    this.netDown(); this.closePlay(true);
    this.note = why === 'reload' ? `🆕 ${esc(hostName || 'Der Host')} lädt die neue Version – der Raum wird neu aufgebaut …` : why === 'idle' ? `💤 ${esc(hostName || 'Der Host')} war lange weg – jemand anderes übernimmt …` : `📴 ${esc(hostName || 'Der Host')} ist ${why === 'leave' ? 'gegangen' : 'nicht mehr erreichbar'} – der Raum wird neu aufgebaut …`;
    if (wasPlaying) toast('📴 Host weg – die laufende Runde ist leider abgebrochen.', 4000);
    this.st = 'connecting'; this.render();
    const ep = ++this.epoch;
    setTimeout(() => { if (ep === this.epoch) this.connect(old, 'host'); }, (why === 'reload' ? 1200 : 400) + rank * 900 + Math.random() * 300);
  },
  sendSet(o) {

  },

  // ---------- Runde anzeigen ----------

// Stammtisch 21: Blackjack gegen den Dealer mit Coin-Einsatz.
MG.register({
  id: 'bj', title: 'Stammtisch 21', icon: '🂡', bg: ['#14532d', '#05200f'], cat: 'karten', players: '1',
  desc: 'Blackjack gegen den Dealer. Setz deine Coins – 21 schlägt alles.', added: '2026-11-03', pop: 84,
  tags: ['blackjack', 'karten', 'einsatz', 'casino', '21'], unit: 'Gewinn',
  help: '<p>Komm näher an <b>21</b> als der Dealer, ohne drüber zu gehen. Bildkarten zählen 10, Ass 1 oder 11. Der Dealer zieht bis 17.</p><p><b>Karte</b> = ziehen · <b>Stehen</b> = aufhören · <b>Verdoppeln</b> = Einsatz ×2, genau eine Karte. Sieg zahlt 1:1, Blackjack (Ass + 10 mit den ersten 2 Karten) 3:2. Der Einsatz kommt aus deinen 🪙 – Gewinne zählen zum Tageslimit.</p>',
  mount(root, api) {
    let deck = api.deck(4), bet = 10, P = [], Dl = [], stake = 0, phase = 'bet', net = 0;
    const val = (h) => { let s = 0, a = 0; for (const c of h) { s += c.r === 14 ? 11 : Math.min(10, c.r); if (c.r === 14) a++; } while (s > 21 && a) { s -= 10; a--; } return s; };
    const draw1 = () => { if (deck.length < 15) deck = api.deck(4); return deck.pop(); };
    root.innerHTML = `<style>.bjt{background:${(SKIN[Wallet.d.equip.felt] || {}).bg || 'radial-gradient(#1f7a4a,#0d3d24)'};border:8px solid #5a3b1c;border-radius:120px/60px;padding:20px 14px;width:100%;max-width:560px;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
      .hand{display:flex;gap:6px;justify-content:center;min-height:88px;flex-wrap:wrap}.lbl{font-size:13px;color:#e8ffe8;margin:4px 0;text-align:center;font-weight:700}</style>
      <div class="gm center"><div class="hud"><span>Guthaben <b id="bj_c">0</b> 🪙</span><span>Heute <b id="bj_n">±0</b></span><span>Bester Gewinn <b>${api.best() || 0}</b></span></div>
      <div class="bjt"><div class="lbl" id="bj_dl">Dealer</div><div class="hand" id="bj_d"></div><div class="msg" id="bj_m" style="margin:10px 0;color:#fff"></div><div class="hand" id="bj_p"></div><div class="lbl" id="bj_pl">Du</div></div>
      <div class="rowc" id="bj_bet"><span class="muted" style="align-self:center">Einsatz:</span>${[10, 25, 50, 100].map((v) => `<button class="btn" data-b="${v}" type="button">${v}</button>`).join('')}<button class="btn main big" id="bj_deal" type="button">Austeilen</button></div>
      <div class="rowc" id="bj_act" hidden><button class="btn green big" id="bj_hit" type="button">➕ Karte</button><button class="btn red big" id="bj_st" type="button">✋ Stehen</button><button class="btn big" id="bj_dbl" type="button">×2 Verdoppeln</button></div></div>`;
    const show = (hide) => {
      $('#bj_d', root).innerHTML = Dl.map((c, i) => api.cardHtml(hide && i === 1 ? null : c, 'deal')).join('');
      $('#bj_p', root).innerHTML = P.map((c) => api.cardHtml(c, 'deal')).join('');
      $('#bj_dl', root).textContent = Dl.length ? 'Dealer ' + (hide ? '?' : val(Dl)) : 'Dealer';
      $('#bj_pl', root).textContent = P.length ? 'Du: ' + val(P) + (stake ? ' · Einsatz ' + stake + ' 🪙' : '') : 'Du';
      $('#bj_c', root).textContent = fmt(api.coins()); $('#bj_n', root).textContent = (net > 0 ? '+' : net < 0 ? '−' : '±') + Math.abs(net);
      $('#bj_bet', root).hidden = phase !== 'bet'; $('#bj_act', root).hidden = phase !== 'play';
      $('#bj_dbl', root).disabled = P.length !== 2 || api.coins() < stake;
      for (const b of $$('[data-b]', root)) b.classList.toggle('main', +b.dataset.b === bet);
    };
    const settle = (res) => {
      phase = 'bet'; api.played();
      let back = 0, prof = 0, txt;
      if (res === 'bj') { back = stake; prof = Math.floor(stake * 1.5); txt = '🂡 BLACKJACK!'; }
      else if (res === 'win') { back = stake; prof = stake; txt = '🏆 Gewonnen!'; }
      else if (res === 'push') { back = stake; txt = '🤝 Unentschieden – Einsatz zurück'; }
      else txt = res === 'bust' ? '💥 Über 21 – verloren' : '🤵 Dealer gewinnt';
      if (back) api.refund(back, 'Stammtisch 21 Einsatz zurück');
      const got = prof ? api.reward(prof, 'Stammtisch 21 Gewinn') : 0;
      net += got - (back ? 0 : stake);
      if (got) api.score(Math.max(api.best() || 0, got));
      api.sfx(prof ? 'win' : back ? 'click' : 'lose');
      $('#bj_m', root).innerHTML = txt + (got ? ` <b style="color:#ffd166">+${got} 🪙</b>` : res === 'push' ? '' : ` <span style="opacity:.8">−${stake} 🪙</span>`);
      stake = 0; show(false);
    };
    const dealerPlay = () => {
      phase = 'dealer'; show(false);
      const loop = () => {
        if (val(Dl) < 17) { Dl.push(draw1()); api.sfx('flip'); show(false); api.timeout(loop, 550); return; }
        const p = val(P), d = val(Dl);
        settle(d > 21 || p > d ? 'win' : p === d ? 'push' : 'lose');
      };
      api.timeout(loop, 500);
    };
    $('#bj_bet', root).onclick = (e) => { const b = e.target.dataset.b; if (b) { bet = +b; api.sfx('click'); show(false); } };
    $('#bj_deal', root).onclick = () => {
      if (api.coins() < bet) { toast('Nicht genug 🪙 – spiel andere MiniGames oder tausche Sats/Chips in der Wechselstube.'); return; }
      api.spend(bet, 'Stammtisch 21 Einsatz', 'new'); stake = bet; P = [draw1(), draw1()]; Dl = [draw1(), draw1()]; phase = 'play'; api.sfx('flip');
      $('#bj_m', root).textContent = '';
      show(true);
      if (val(P) === 21) { phase = 'dealer'; show(false); api.timeout(() => settle(val(Dl) === 21 ? 'push' : 'bj'), 600); }
    };
    $('#bj_hit', root).onclick = () => { if (phase !== 'play') return; P.push(draw1()); api.sfx('flip'); show(true); if (val(P) > 21) { phase = 'dealer'; show(false); api.timeout(() => settle('bust'), 500); } else if (val(P) === 21) dealerPlay(); };
    $('#bj_st', root).onclick = () => { if (phase === 'play') dealerPlay(); };
    $('#bj_dbl', root).onclick = () => {
      if (phase !== 'play' || P.length !== 2 || !api.spend(stake, 'Stammtisch 21 Verdoppeln', 'add')) return;
      stake *= 2; P.push(draw1()); api.sfx('flip'); show(true);
      if (val(P) > 21) { phase = 'dealer'; show(false); api.timeout(() => settle('bust'), 500); } else dealerPlay();
    };
    $('#bj_m', root).textContent = 'Einsatz wählen und austeilen!';
    show(false);
  },
});

  mount(root, api) {

    const holes = $$('.hole', root), DUR = 30;

// High-Low: Ist die nächste Karte höher oder niedriger? Serie aufbauen, rechtzeitig Kasse machen.
MG.register({
  id: 'highlow', title: 'High-Low', icon: '🃏', bg: ['#7a1f1f', '#2a0c0c'], cat: 'karten', players: '1',
  desc: 'Höher oder niedriger? Bau eine Serie auf und mach rechtzeitig Kasse.', added: '2026-11-03', pop: 88,
  tags: ['karten', 'glück', 'serie', 'schnell'], unit: 'Serie',
  help: '<p>Tippe, ob die nächste Karte <b>höher</b> oder <b>niedriger</b> ist (Ass ist hoch). Gleicher Wert = unentschieden, die Serie bleibt.</p><p>Jeder Treffer erhöht den Topf. Mit <b>Kasse machen</b> sicherst du die Coins – ein Fehler und der Topf ist weg!</p>',
  mount(root, api) {
    let deck = api.deck(), cur = deck.pop(), streak = 0, pot = 0, busy = false;
    const potFor = (s) => Math.round(2 * s * s / 3 + 2 * s); // 1:3 2:7 3:12 4:19 5:27 …
    root.innerHTML = `<div class="gm center">
      <div class="hud"><span>Serie <b id="hl_s">0</b></span><span>Topf <b id="hl_p">0</b> 🪙</span><span>Rekord <b>${api.best() || 0}</b></span></div>
      <div class="rowc" style="align-items:center;gap:22px"><div id="hl_cur"></div><div style="font-size:26px" class="muted">→</div><div id="hl_next"></div></div>
      <div class="msg" id="hl_m">Höher oder niedriger als die ${''}Karte links?</div>
      <div class="rowc"><button class="btn green big" id="hl_hi" type="button">▲ Höher</button><button class="btn red big" id="hl_lo" type="button">▼ Niedriger</button></div>
      <button class="btn main" id="hl_cash" type="button" disabled>💰 Kasse machen</button>
      <div class="muted" style="font-size:12px">Noch <span id="hl_left">${deck.length}</span> Karten im Stapel</div></div>`;
    const draw = (next) => {
      $('#hl_cur', root).innerHTML = api.cardHtml(cur, 'big deal');
      $('#hl_next', root).innerHTML = next ? api.cardHtml(next, 'big deal') : api.cardHtml(null, 'big');
      $('#hl_s', root).textContent = streak; $('#hl_p', root).textContent = pot; $('#hl_left', root).textContent = deck.length;
      $('#hl_cash', root).disabled = !pot || busy;
    };
    const end = (lost) => {
      busy = true; api.played();
      const rec = api.score(streak);
      const got = lost ? 0 : api.reward(pot, 'High-Low Serie ' + streak);
      api.finish({ title: lost ? '💥 Daneben!' : '💰 Kasse gemacht!', text: `Serie: <b>${streak}</b>${rec && streak ? ' – neuer Rekord! 🏆' : ''}${lost && pot ? `<br>Der Topf von ${pot} 🪙 ist weg.` : ''}`, coins: got });
    };
    const guess = (up) => {
      if (busy) return; busy = true; api.sfx('flip');
      if (!deck.length) deck = api.deck();
      const nx = deck.pop(); draw(nx);
      const ok = nx.r === cur.r ? null : (nx.r > cur.r) === up;
      api.timeout(() => {
        if (ok === false) { api.sfx('bad'); $('#hl_m', root).textContent = 'Leider falsch …'; return end(true); }
        if (ok) { streak++; pot = potFor(streak); api.sfx('good'); $('#hl_m', root).textContent = pick(['Treffer! 🚀', 'Bullish! 📈', 'Sauber!', 'Weiter so!']); }
        else $('#hl_m', root).textContent = 'Gleicher Wert – Serie bleibt.';
        cur = nx; busy = false; draw(null);
      }, 650);
    };
    $('#hl_hi', root).onclick = () => guess(true);
    $('#hl_lo', root).onclick = () => guess(false);
    $('#hl_cash', root).onclick = () => { if (!busy && pot) end(false); };
    api.on(window, 'keydown', (e) => { if (e.key === 'ArrowUp') guess(true); if (e.key === 'ArrowDown') guess(false); if (e.key === 'Enter' && pot) end(false); });
    draw(null);
  },
});

// Kniffel-Mini: 7 Runden, 3 Würfe pro Zug, gegen den Stammtisch-Bot.
(() => {
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const dieHtml = (v, held, i, roll) => `<button type="button" class="die${held ? ' held' : ''}${roll ? ' roll' : ''}" data-i="${i}" aria-label="Würfel ${v}${held ? ', gehalten' : ''}">${Array.from({ length: 9 }, (_, k) => `<i${PIPS[v].includes(k) ? ' class="p"' : ''}></i>`).join('')}</button>`;
  const css = `<style>.die{width:58px;height:58px;border-radius:12px;background:#fbf7ee;border:3px solid transparent;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:2px;cursor:pointer;box-shadow:0 4px 0 #b9ad98,0 6px 12px rgba(0,0,0,.4)}
  .die i{border-radius:50%}.die i.p{background:#1b1b1b}.die.held{border-color:#f7931a;transform:translateY(4px);box-shadow:0 0 0 #b9ad98,0 0 14px rgba(247,147,26,.8)}
  .die.roll{animation:dr .35s}@keyframes dr{30%{transform:rotate(25deg) scale(.9)}70%{transform:rotate(-15deg)}}
  .kt{width:100%;max-width:440px;border-collapse:collapse;font-size:14px}.kt td,.kt th{padding:6px 8px;border-bottom:1px solid #2a2219;text-align:left}.kt td.n,.kt th.n{text-align:right;font-variant-numeric:tabular-nums;width:70px}
  .kt tr.pickable{cursor:pointer}.kt tr.pickable:hover td{background:#2a1f10}.kt tr.pickable td.n.me{color:#3ecf8e;font-weight:800}
  .kt tfoot td{font-weight:800;border-top:2px solid #3a2e20}@media(max-width:560px){.die{width:48px;height:48px;padding:6px}}</style>`;
  const CATS_K = [
    ['dp', 'Dreierpasch', 'Summe aller Augen'], ['vp', 'Viererpasch', 'Summe aller Augen'], ['fh', 'Full House', '25'],
    ['ks', 'Kleine Straße', '30 (4 in Folge)'], ['gs', 'Große Straße', '40 (5 in Folge)'], ['kn', 'Kniffel', '50 (5 gleiche)'], ['ch', 'Chance', 'Summe aller Augen'],
  ];
  function scoreOf(cat, d) {
    const c = [0, 0, 0, 0, 0, 0, 0]; for (const v of d) c[v]++;
    const sum = d.reduce((a, b) => a + b, 0), mx = Math.max(...c), u = new Set(d);
    const run = (n) => { for (let s = 1; s <= 7 - n; s++) { let ok = true; for (let k = 0; k < n; k++) if (!u.has(s + k)) ok = false; if (ok) return true; } return false; };
    switch (cat) {
      case 'dp': return mx >= 3 ? sum : 0; case 'vp': return mx >= 4 ? sum : 0;
      case 'fh': return (c.includes(3) && c.includes(2)) || mx === 5 ? 25 : 0;
      case 'ks': return run(4) ? 30 : 0; case 'gs': return run(5) ? 40 : 0;
      case 'kn': return mx === 5 ? 50 : 0; case 'ch': return sum;
    }

// ---- games/mp-airhockey.js ----
// Krypto-Air-Hockey – Echtzeit-Mehrspieler (2 Spieler). Der Host rechnet die Puck-Physik; der eigene Schläger
// wird lokal sofort gezeichnet (Vorhersage) und vom Host-Wert nur sanft korrigiert.
// Eingabe: {x,y} Zielposition (Maus/Finger, Logik-Koordinaten) oder {mx,my} Richtung (Tasten), {ai:1} KI, {hb:1} Host-Tab im Hintergrund.
(() => {
  const W = 640, H = 360, R = 24, PR = 15, G0 = 112, G1 = 248, MSPD = 1500, KSPD = 560, PMAX = 1150, BOTSPD = 720, MAXT = 300;
  const num = (v, a, b, d) => (typeof v === 'number' && isFinite(v) ? Math.max(a, Math.min(b, v)) : d);
  const box = (p) => (p === 0 ? [R, W / 2 - R] : [W / 2 + R, W - R]);
  const toSide = (k, x, y) => (k === 0 ? [x, y] : [W - x, y]);
  const fromSide = (k, d, u) => (k === 0 ? [d, u] : [W - d, u]);

  function faceoff(s, p) { // Puck in die Hälfte von p, kurz warten
    s.k = { x: p === 0 ? W / 4 : p === 1 ? W * 3 / 4 : W / 2, y: H / 2, vx: 0, vy: 0 }; s.wait = 1.0; s.quiet = 0;
  }
  const mp = {
    min: 2, max: 2, bots: true, local: true, realtime: true, hz: 30, snapHz: 20, coins: { win: 28 },
    opts: [{ id: 'pts', label: 'Spiel bis', type: 'select', def: 7, choices: [[7, '7 Tore'], [5, '5 Tore'], [3, '3 Tore (kurz)']] }],
    setup(players, opts) {
      const s = { t: 0, T: [3, 5, 7].indexOf(+opts.pts) >= 0 ? +opts.pts : 7, M: [{ x: 70, y: H / 2, vx: 0, vy: 0 }, { x: W - 70, y: H / 2, vx: 0, vy: 0 }],
        sc: [0, 0], k: null, wait: 0, e: 0, ax: 0, ay: 0, stuck: 0, gl: -1, ge: 0, hb: 0, quiet: 0, ai: [{ nt: 0, x: 70, y: H / 2 }, { nt: 0, x: W - 70, y: H / 2 }] };
      faceoff(s, (opts._round || 0) % 2); s.wait = 1.5;
      return s;
    },
    tick(s, inputs, dt, rnd) {
      s.t += dt; s.hb = 0;
      const tg = [0, 1].map((p) => {
        let inp = inputs[p] || {};
        if (inp.hb) s.hb = 1;
        if (inp.ai) inp = mp.botInput(s, p, rnd);
        const [x0, x1] = box(p), m = s.M[p], spd = num(inp.sp, 100, MSPD, MSPD);
        const tx = num(inp.x, x0, x1, null), ty = num(inp.y, R, H - R, null);
        if (tx !== null && ty !== null) return { x: tx, y: ty, spd };
        const mx = num(inp.mx, -1, 1, 0), my = num(inp.my, -1, 1, 0);
        return { x: Math.max(x0, Math.min(x1, m.x + mx * KSPD * dt)), y: Math.max(R, Math.min(H - R, m.y + my * KSPD * dt)), spd: Math.max(KSPD, Math.min(spd, KSPD)) };
      });
      const N = 6, h = dt / N, k = s.k;
      if (s.wait > 0) s.wait -= dt;
      s.quiet += dt;
      if (s.quiet > 15) { faceoff(s, -1); k.vx = (rnd() - 0.5) * 60; return s; }
      for (let st = 0; st < N; st++) {
        for (let p = 0; p < 2; p++) { // Schläger fahren mit Höchsttempo zum Ziel
          const m = s.M[p], dx = tg[p].x - m.x, dy = tg[p].y - m.y, l = Math.hypot(dx, dy), mv = Math.min(l, tg[p].spd * h);
          const nx = l > 0 ? m.x + dx / l * mv : m.x, ny = l > 0 ? m.y + dy / l * mv : m.y;
          m.vx = (nx - m.x) / h; m.vy = (ny - m.y) / h; m.x = nx; m.y = ny;
        }
        if (s.wait > 0) continue;
        k.x += k.vx * h; k.y += k.vy * h;
        // Banden oben/unten
        if (k.y < PR) { k.y = 2 * PR - k.y; k.vy = Math.abs(k.vy) * 0.9; }
        if (k.y > H - PR) { k.y = 2 * (H - PR) - k.y; k.vy = -Math.abs(k.vy) * 0.9; }
        // Seiten: Tor oder Bande
        const inMouth = k.y > G0 + 2 && k.y < G1 - 2;
        if (!inMouth) {

// Sats-Snake: Sats fressen, Bären ausweichen. Pfeiltasten/WASD, Wischen oder Steuerkreuz.
MG.register({
  id: 'snake', title: 'Sats-Snake', icon: '🐍', bg: ['#2b6b1f', '#0b2208'], cat: 'geschick', players: '1',
  desc: 'Friss ⚡ Sats und wachse – aber pass auf die Bären und deinen eigenen Schwanz auf.', added: '2026-11-03', pop: 78,
  tags: ['snake', 'klassiker', 'reaktion', 'highscore'], unit: 'Sats',
  help: '<p>Steuern mit <b>Pfeiltasten/WASD</b>, durch <b>Wischen</b> oder mit dem Steuerkreuz. ⚡ = +1, 💎 = +5 (verschwindet nach ein paar Sekunden). Alle 5 Sats taucht ein 🐻 auf – nicht reinfahren!</p><p>Coins: 1 🪙 pro Sat (max. 80 pro Runde).</p>',
  mount(root, api) {
    const N = 18, C = 20;
    root.innerHTML = `<div class="gm center"><div class="hud" id="sn_h"></div><div id="sn_c"></div>
      <div class="rowc" style="gap:6px"><button class="btn big" data-d="L" type="button">◀</button><div style="display:flex;flex-direction:column;gap:6px"><button class="btn big" data-d="U" type="button">▲</button><button class="btn big" data-d="D" type="button">▼</button></div><button class="btn big" data-d="R" type="button">▶</button></div></div>`;
    const { g, cv } = api.canvas(N * C, N * C, $('#sn_c', root));
    const D = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
    let S;
    const free = () => { for (;;) { const p = [rnd(0, N - 1), rnd(0, N - 1)]; if (!S.body.some((b) => b[0] === p[0] && b[1] === p[1]) && !S.bears.some((b) => b[0] === p[0] && b[1] === p[1])) return p; } };
    const reset = () => { S = { body: [[5, 9], [4, 9], [3, 9]], dir: 'R', q: [], bears: [], sats: 0, acc: 0, alive: true, started: false, gem: null }; S.food = free(); hud(); };
    const hud = () => { $('#sn_h', root).innerHTML = `<span>⚡ <b>${S.sats}</b></span><span>Länge <b>${S.body.length}</b></span><span>Rekord <b>${api.best() || 0}</b></span>`; };
    const turn = (d) => { if (!S.alive) return; S.started = true; const last = S.q.length ? S.q[S.q.length - 1] : S.dir; const a = D[d], b = D[last]; if (a[0] === -b[0] && a[1] === -b[1]) return; if (S.q.length < 3) S.q.push(d); };
    api.on(window, 'keydown', (e) => { const m = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R' }[e.key]; if (m) { e.preventDefault(); turn(m); } });
    root.addEventListener('click', (e) => { const d = e.target.dataset.d; if (d) turn(d); });
    let sx = 0, sy = 0;
    api.on(cv, 'pointerdown', (e) => { sx = e.clientX; sy = e.clientY; });
    api.on(cv, 'pointerup', (e) => { const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return; turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U')); });
    const over = () => {
      S.alive = false; api.sfx('bad'); api.played();
      const rec = api.score(S.sats), got = api.reward(Math.min(80, S.sats), 'Sats-Snake: ' + S.sats + ' ⚡');
      api.timeout(() => api.finish({ title: '🐍 Game Over', text: `${S.sats} Sats gefressen${rec && S.sats ? '<br>Neuer Rekord! 🏆' : ''}`, coins: got }), 450);
    };
    const step = () => {
      if (S.q.length) S.dir = S.q.shift();
      const hd = S.body[0], d = D[S.dir], n = [hd[0] + d[0], hd[1] + d[1]];
      const hit = (arr) => arr.some((b) => b[0] === n[0] && b[1] === n[1]);
      if (n[0] < 0 || n[1] < 0 || n[0] >= N || n[1] >= N || hit(S.body.slice(0, -1)) || hit(S.bears)) return over();
      S.body.unshift(n);
      if (n[0] === S.food[0] && n[1] === S.food[1]) {
        S.sats++; api.sfx('coin'); S.food = free();
        if (S.sats % 5 === 0) S.bears.push(free());
        if (!S.gem && Math.random() < 0.18) S.gem = { p: free(), t: 6 };
      } else if (S.gem && n[0] === S.gem.p[0] && n[1] === S.gem.p[1]) { S.sats += 5; api.sfx('good'); S.gem = null; S.body.push(S.body[S.body.length - 1]); }
      else S.body.pop();
      hud();
    };
    reset();
    api.raf((dt) => {
      if (S.alive && S.started) { S.acc += dt; const iv = Math.max(0.065, 0.14 - S.sats * 0.0018); while (S.acc > iv && S.alive) { S.acc -= iv; step(); } if (S.gem && (S.gem.t -= dt) <= 0) S.gem = null; }
      g.fillStyle = '#0b1a08'; g.fillRect(0, 0, N * C, N * C);
      for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if ((x + y) % 2) { g.fillStyle = '#0f220b'; g.fillRect(x * C, y * C, C, C); }
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = (C - 2) + 'px serif';
      g.fillText('⚡', S.food[0] * C + C / 2, S.food[1] * C + C / 2 + 1);
      if (S.gem) g.fillText('💎', S.gem.p[0] * C + C / 2, S.gem.p[1] * C + C / 2 + 1);
      for (const b of S.bears) g.fillText('🐻', b[0] * C + C / 2, b[1] * C + C / 2 + 1);
      S.body.forEach((b, i) => { g.fillStyle = i ? `hsl(${32 + (i % 6) * 3},95%,${55 - Math.min(20, i)}%)` : '#ffd166'; g.beginPath(); g.roundRect(b[0] * C + 1, b[1] * C + 1, C - 2, C - 2, 6); g.fill(); });
      const hd = S.body[0]; g.fillStyle = '#1a0e00'; g.fillRect(hd[0] * C + 6, hd[1] * C + 6, 3, 3); g.fillRect(hd[0] * C + 12, hd[1] * C + 6, 3, 3);
      if (!S.started) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(30, 150, N * C - 60, 56); g.fillStyle = '#f5eee2'; g.font = 'bold 16px system-ui'; g.fillText('Richtung wählen zum Starten', N * C / 2, 178); }
    });
  },
});

      let best = turn === me ? -99 : 99;
      for (let i = 0; i < 9; i++) if (b[i] < 0) { b[i] = turn; const s = mm(b, me, 1 - turn, depth + 1); b[i] = -1; best = turn === me ? Math.max(best, s) : Math.min(best, s); }

    const SYM = ['🐂', '🐻'];

      },
      view: (s) => s,

          M.textContent = e.over ? '' : mp.isMyTurn() ? `Du bist dran (${SYM[mp.me]})` : `${SYM[v.turn]} ${mp.name(v.turn)} ist dran …`;
          if (v.last >= 0) mp.sfx('click');
        });
        B.onclick = (e) => { const i = +e.target.dataset.i; if (!isNaN(i) && mp.isMyTurn()) mp.send({ t: 'mark', i }); };
      },
    };
  })(),
  mount(root, api) {
    const L = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    const win = (b) => { for (const l of L) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { p: b[l[0]], l }; return b.every(Boolean) ? { p: 0 } : null; };
    function mm(b, me, turn, depth) {
      const w = win(b); if (w) return w.p === me ? 10 - depth : w.p ? depth - 10 : 0;
      let best = turn === me ? -99 : 99;
      for (let i = 0; i < 9; i++) if (!b[i]) { b[i] = turn; const s = mm(b, me, turn === 1 ? 2 : 1, depth + 1); b[i] = 0; best = turn === me ? Math.max(best, s) : Math.min(best, s); }
      return best;
    }
    const botMove = (b, lvl) => {
      const free = b.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);

        return true;

      $('#tt_b', root).onclick = (e) => {
        const i = +e.target.dataset.i; if (over || isNaN(i) || b[i] || (lvl !== 9 && turn !== 1)) return;

    };
    menu();

      const cx = W / 2, cy = H / 2, R = 160; g.clearRect(0, 0, W, H);

    const d = Wallet.d, fr = SKIN[d.equip.frame], tt = SKIN[d.equip.title], A = Account;
    const nm = A.on ? A.s.name : playerName();
    const eqList = Object.entries(SLOTS).map(([k, v]) => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #241c14"><span class="muted">${v}</span><b>${d.equip[k] ? esc(SKIN[d.equip[k]].name) : '–'}</b></div>`).join('');
    m.appendChild(h(`<div class="cols">
      <div class="card" id="accCard"></div>
      <div class="card" style="text-align:center"><div class="frame" style="margin:6px auto 12px;width:86px;height:86px;font-size:42px;${fr ? `box-shadow:0 0 0 5px ${fr.ring},0 0 22px ${fr.ring}` : 'box-shadow:0 0 0 3px #3a2e20'}">${fr ? fr.icon : '🙂'}</div>
        <h2 style="font-size:20px;color:var(--txt);letter-spacing:0">${esc(nm)}${A.on || nm === 'Gast' ? '' : ' <span class="muted" style="font-size:13px">(Gast)</span>'}</h2>${tt ? `<div class="ttl r${tt.rar}" style="display:inline-block;margin-top:6px">${esc(tt.txt)}</div>` : '<div class="muted" style="margin-top:6px">Noch kein Titel – im Shop gibt\'s welche.</div>'}
        <div class="rowc" style="margin-top:12px"><span class="pill c">🪙 ${fmt(d.coins)}</span><span class="pill">🕹️ ${fmt(d.stats.games)} Spiele</span><span class="pill">💰 ${fmt(d.stats.earned)} verdient</span><span class="pill">🎒 ${Object.keys(d.owned).length}/${SKINS.length} Skins</span></div></div>
      <div class="card"><h2>DEINE REKORDE</h2>${MG.games.filter((g) => g.best).map((g) => `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #241c14"><span>${g.icon} ${esc(g.title)}</span><b>${d.hs[g.id] !== undefined ? fmt(d.hs[g.id]) + ' ' + g.unit : '<span class="muted">–</span>'}</b></div>`).join('')}</div>
      <div class="card"><h2>ANGELEGT</h2>${eqList}<div style="margin-top:12px"><button class="btn sm" type="button" id="wipe">🗑️ ${A.on ? 'Fortschritt im Konto zurücksetzen' : 'Gast-Daten zurücksetzen'}</button></div></div></div>`));
    $('#wipe').onclick = (e) => {
      const b = e.target;
      if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = '⚠️ Wirklich alles löschen? Nochmal klicken'; return; }
      Wallet.op({ op: 'wipe' }); toast('Zurückgesetzt – 100 🪙 Startbonus.'); this.render();
    };
    this.accCard($('#accCard'));
  },
  accMode: 'login',
  accCard(el) {
    const A = Account, inp = (id, label, type, ac, extra = '') => `<label class="fld"><span>${label}</span><input id="${id}" type="${type}" autocomplete="${ac}" ${extra}></label>`;
    const style = `<style>.fld{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px;color:var(--mut)}.fld input{background:#0f0c09;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}.fld input:focus{outline:0;border-color:var(--gold)}
      .acctabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.acctabs button{appearance:none;border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}.acctabs button.on{border-color:var(--gold);color:var(--gold)}
      .err{color:var(--red);font-weight:600;min-height:18px;font-size:13px}.okm{color:var(--green);font-weight:600;font-size:13px}</style>`;
    if (!A.ready) {
      el.innerHTML = style + `<h2>👤 KONTO</h2><p>Mit einem Konto (Name + Passwort, E-Mail freiwillig) liegen deine Coins, Skins und Rekorde sicher auf dem Server – auf jedem Gerät gleich, und bereit für die Discord-Bestenliste.</p><p class="muted">Der Konto-Server wird gerade eingerichtet – bis dahin spielst du als Gast in diesem Browser. Dein Gast-Fortschritt wird beim Registrieren übernommen.</p>`;
      return;
    }
    if (A.on) {
      el.innerHTML = style + `<h2>👤 DEIN KONTO</h2>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">Name</span><b>${esc(A.s.name)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:4px 0"><span class="muted">E-Mail</span><b>${A.s.email ? esc(A.s.email) : '<span class="muted">keine</span>'}</b></div>
        <p class="muted" style="font-size:12.5px">Coins, Skins und Rekorde werden automatisch gespeichert und sind auf jedem Gerät gleich, auf dem du dich einloggst.</p>
        <div class="rowc" style="justify-content:flex-start"><button class="btn sm" data-m="email" type="button">✉️ E-Mail ${A.s.email ? 'ändern' : 'hinzufügen'}</button><button class="btn sm" data-m="pw" type="button">🔑 Passwort ändern</button><button class="btn sm" id="accOut" type="button">🚪 Abmelden</button><button class="btn sm" data-m="del" type="button">🗑️ Konto löschen</button></div>
        <form id="accForm" hidden></form><div class="err" id="accErr"></div>`;
      $('#accOut', el).onclick = async () => { await A.logout(); toast('Abgemeldet – du spielst wieder als Gast.'); this.pills(); this.render(); };
      el.onclick = (e) => {
        const md = e.target.dataset.m; if (!md) return;
        const f = $('#accForm', el); f.hidden = false; f.dataset.m = md; $('#accErr', el).textContent = '';
        f.innerHTML = {
          email: inp('a_email', 'Neue E-Mail (leer lassen = entfernen)', 'email', 'email', `value="${esc(A.s.email)}"`) + inp('a_pw', 'Dein Passwort zur Bestätigung', 'password', 'current-password', 'required'),
          pw: inp('a_pw', 'Altes Passwort', 'password', 'current-password', 'required') + inp('a_npw', 'Neues Passwort (mind. 6 Zeichen)', 'password', 'new-password', 'required minlength="6"'),
          del: '<p class="err" style="margin:6px 0">Das Konto und alle Coins, Skins und Rekorde werden endgültig gelöscht.</p>' + inp('a_pw', 'Passwort zur Bestätigung', 'password', 'current-password', 'required'),
        }[md] + `<button class="btn ${md === 'del' ? 'red' : 'main'}" type="submit">${md === 'del' ? 'Endgültig löschen' : 'Speichern'}</button>`;
        f.onsubmit = (ev) => { ev.preventDefault(); this.accSubmit(md, el); };
      };
      return;
    }
    const mode = this.accMode;
    el.innerHTML = style + `<h2>👤 KONTO</h2><div class="acctabs"><button type="button" data-t="login" class="${mode === 'login' ? 'on' : ''}">Einloggen</button><button type="button" data-t="reg" class="${mode === 'reg' ? 'on' : ''}">Registrieren</button><button type="button" data-t="forgot" class="${mode.startsWith('forgot') ? 'on' : ''}">Passwort vergessen</button></div>
      <form id="accForm" autocomplete="on">${{
        login: inp('a_id', 'Name oder E-Mail', 'text', 'username', 'required maxlength="80"') + inp('a_pw', 'Passwort', 'password', 'current-password', 'required') + '<button class="btn main" type="submit">Einloggen</button>',
        reg: inp('a_name', 'Name (2–18 Zeichen, so sehen dich die anderen)', 'text', 'username', 'required minlength="2" maxlength="18"') + inp('a_pw', 'Passwort (mind. 6 Zeichen)', 'password', 'new-password', 'required minlength="6"') + inp('a_pw2', 'Passwort wiederholen', 'password', 'new-password', 'required minlength="6"') + inp('a_email', 'E-Mail (freiwillig – nur fürs Zurücksetzen des Passworts)', 'email', 'email', 'maxlength="80"')
          + `<p class="muted" style="font-size:12px;margin:4px 0 10px">Dein Gast-Fortschritt in diesem Browser (Coins bis 1 500, Skins, Rekorde) wird ins Konto übernommen. Die E-Mail wird nur fürs Passwort-Zurücksetzen gespeichert und nirgends angezeigt.</p><button class="btn main" type="submit">Konto erstellen</button>`,
        forgot: inp('a_id', 'Name oder E-Mail', 'text', 'username', 'required') + '<p class="muted" style="font-size:12px">Geht nur, wenn im Konto eine E-Mail hinterlegt ist. Du bekommst einen 6-stelligen Code.</p><button class="btn main" type="submit">Code schicken</button>',
        forgot2: `<p class="okm">Falls eine E-Mail hinterlegt ist, ist der Code unterwegs (Spam-Ordner prüfen).</p>` + inp('a_code', 'Code aus der E-Mail', 'text', 'one-time-code', 'required inputmode="numeric" maxlength="6"') + inp('a_npw', 'Neues Passwort (mind. 6 Zeichen)', 'password', 'new-password', 'required minlength="6"') + '<button class="btn main" type="submit">Passwort setzen</button>',
      }[mode]}</form><div class="err" id="accErr"></div>`;
    $('.acctabs', el).onclick = (e) => { const t = e.target.dataset.t; if (t) { this.accMode = t; this.accCard(el); } };
    $('#accForm', el).onsubmit = (ev) => { ev.preventDefault(); this.accSubmit(mode, el); };
  },
  async accSubmit(mode, el) {
    const A = Account, v = (id) => { const x = $('#' + id, el); return x ? x.value.trim() : ''; }, pwv = (id) => { const x = $('#' + id, el); return x ? x.value : ''; };
    const err = $('#accErr', el), btn = $('#accForm button[type=submit]', el);
    err.textContent = ''; btn.disabled = true; const old = btn.textContent; btn.textContent = '⏳ …';
    try {
      let r;
      if (mode === 'login') r = await A.login(v('a_id'), pwv('a_pw'));
      else if (mode === 'reg') {
        if (pwv('a_pw') !== pwv('a_pw2')) throw new Error('Die beiden Passwörter sind nicht gleich.');
        r = await A.register(v('a_name'), pwv('a_pw'), v('a_email'));
      } else if (mode === 'forgot') { this.accId = v('a_id'); r = await A.call('resetReq', { id: this.accId }); if (r.ok) { this.accMode = 'forgot2'; this.accCard(el); return; } }
      else if (mode === 'forgot2') { r = await A.call('resetDo', { id: this.accId, code: v('a_code'), npw: pwv('a_npw') }); if (r.ok) { A.stashGuest(); A.setSession(r); } }
      else if (mode === 'email') { r = await A.call('setEmail', { token: A.s.token, pw: pwv('a_pw'), email: v('a_email') }); if (r.ok) { A.s.email = r.user.email || ''; ls.set(SKEY, A.s); } }
      else if (mode === 'pw') r = await A.call('changePw', { token: A.s.token, pw: pwv('a_pw'), npw: pwv('a_npw') });
      else if (mode === 'del') { r = await A.call('delete', { token: A.s.token, pw: pwv('a_pw') }); if (r.ok) { A.s = null; ls.set(SKEY, null); A.lost('Konto gelöscht.'); } }
      if (!r || !r.ok) throw new Error((r && r.msg) || 'Das hat nicht geklappt.');
      Sound.fx('good');
      toast({ login: `Willkommen zurück, ${esc(A.s && A.s.name)}! 👋`, reg: `Konto „${esc(A.s && A.s.name)}“ erstellt! 🎉`, forgot2: 'Neues Passwort gesetzt – du bist eingeloggt.', email: 'E-Mail gespeichert.', pw: 'Passwort geändert.', del: 'Konto gelöscht.' }[mode] || 'Erledigt.');
      this.accMode = 'login'; this.pills(); this.render();
    } catch (e) { err.textContent = e.message; Sound.fx('bad'); btn.disabled = false; btn.textContent = old; }
  },
};
UI.init();
Account.refresh();
window.MG = MG; window.Wallet = Wallet; window.UI = UI; window.Account = Account; // für Tests und künftige Erweiterungen

</script>
</body>
</html>
