<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokerabend</title>
<meta name="description" content="Texas Hold'em mit Spielgeld für unseren Discord. Link öffnen, Namen eingeben, Platz nehmen.">
<meta property="og:title" content="Pokerabend – Texas Hold'em">
<meta property="og:description" content="No-Limit Hold'em mit Spielgeld. Bis zu 12 Leute an einem Tisch, jederzeit einsteigen.">
<meta name="theme-color" content="#0b1112">
<style>html,body{margin:0;height:100%;background:#0b1112;color:#ecebe3;font:16px system-ui,sans-serif}#l{display:grid;place-items:center;height:100%;text-align:center;padding:16px;box-sizing:border-box}</style>
</head>
<body>
<div id="l">Pokertisch wird geladen …</div>
<script>
// Lädt den Tisch von Google Apps Script – ohne Google-Anmeldung, daher egal wie viele Konten angemeldet sind
var API = 'https://script.google.com/macros/s/AKfycbxPyN_HEhryQYB_p7u61YUh6KqOP1G2CabTS5XM0nQbynswcKALsfoGk-dfYokaUnyX/exec';
function load(n) {
  fetch(API + '?ui=1', { credentials: 'omit' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (h) {
    h = h.replace('<head>', '<head><script>window.PK_API=' + JSON.stringify(API) + ';<\/script>');
    document.open(); document.write(h); document.close();
  }).catch(function () {
    document.getElementById('l').textContent = 'Verbindung klappt gerade nicht – neuer Versuch …';
    setTimeout(function () { load(n + 1); }, Math.min(10000, 1500 * (n + 1)));
  });
}
load(0);
</script>
</body>
</html>
