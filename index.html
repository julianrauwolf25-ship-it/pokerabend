<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guruhalle Stammtisch – Poker, Kart & MiniGames</title>
<meta name="description" content="Pokerabend, Kart-Rennen und MiniGames für den Guruhalle-Discord. Link öffnen, Namen eingeben, loslegen.">
<meta property="og:title" content="Guruhalle Stammtisch – Poker, Kart & MiniGames">
<meta property="og:description" content="No-Limit Hold'em mit Spielgeld, Live-Kartrennen mit Krypto-Items und ein MiniGame Center mit Skins. To the Moon! 🚀">
<meta name="theme-color" content="#0b0907">
<style>
html,body{margin:0;height:100%;background:#0b0907;color:#f5eee2;font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#tabs{position:fixed;left:0;right:0;top:0;height:calc(42px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));box-sizing:border-box;display:flex;align-items:center;gap:8px;background:#0b0907;border-bottom:1px solid #3a2e20;z-index:10}
.coin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffc56b,#f7931a 55%,#b85f05);color:#fff;font:800 16px/1 system-ui;flex:none;box-shadow:0 0 12px rgba(247,147,26,.45)}
.name{color:#f2b33d;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;margin-right:6px;white-space:nowrap}
@media (max-width:700px){.name{display:none}}
.tab{appearance:none;border:1px solid #3a2e20;background:#15110d;color:#f5eee2;border-radius:10px;padding:6px 14px;font:600 14px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(180deg,#ffb347,#f7931a);border-color:#ffcf86;color:#1a0e00}
.tab:not(.on):hover{border-color:#f2b33d}
#wal{margin-left:auto;appearance:none;border:1px solid #7a5a1c;background:#15110d;color:#f2b33d;border-radius:999px;padding:4px 11px;font:700 14px system-ui,sans-serif;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
#wal.bump{animation:bump .6s}@keyframes bump{30%{transform:scale(1.15);box-shadow:0 0 14px rgba(242,179,61,.7)}}
@media (max-width:480px){.tab{padding:6px 9px;font-size:13px}.long{display:none}#tabs{gap:6px}}
@media (min-width:481px){.short{display:none}}
#frames{position:fixed;left:0;right:0;bottom:0;top:calc(42px + env(safe-area-inset-top))}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#0b0907}
iframe.on{display:block}
body.race #tabs{display:none}
body.race #frames{top:0}
#edge{position:fixed;left:50%;top:0;transform:translateX(-50%);width:120px;height:8px;border-radius:0 0 8px 8px;background:rgba(247,147,26,.35);z-index:11;cursor:pointer;display:none}
body.race #edge{display:block}#edge:hover{background:rgba(247,147,26,.8);height:12px}
</style>
</head>
<body>
<nav id="tabs">
  <div class="coin">₿</div><span class="name">Guruhalle Stammtisch</span>
  <button class="tab" type="button" data-t="poker">♠ Poker</button>
  <button class="tab" type="button" data-t="rennen">🏎️ <span class="long">Kart-Rennen</span><span class="short">Kart</span></button>
  <button class="tab" type="button" data-t="minigames">🎮 <span class="long">MiniGames</span><span class="short">Games</span></button>
  <button id="wal" type="button" title="Deine Guru-Coins – im MiniGame Center gegen Skins tauschen">🪙 0</button>
</nav>
<div id="frames">
  <iframe id="f-poker" title="Pokerabend" allow="clipboard-write; fullscreen; autoplay"></iframe>
  <iframe id="f-rennen" title="Guruhalle Kart" allow="clipboard-write; fullscreen; autoplay; gamepad; screen-wake-lock"></iframe>
  <iframe id="f-minigames" title="MiniGame Center" allow="fullscreen; autoplay"></iframe>
</div>
<script>
// Drei Reiter: Poker, Kart, MiniGames. #rennen öffnet direkt das Rennen, #rennen=raumcode einen privaten Raum, #minigames das MiniGame Center.
(function () {
  var frames = { poker: document.getElementById('f-poker'), rennen: document.getElementById('f-rennen'), minigames: document.getElementById('f-minigames') };
  var src = { poker: 'poker.html', rennen: 'rennen.html', minigames: 'minigames.html' };
  var cur = null;
  function parseHash() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ''));
    var m = h.match(/^(poker|rennen|minigames)(?:=([a-z0-9-]{1,24}))?$/i);
    return m ? { tab: m[1].toLowerCase(), room: m[2] ? m[2].toLowerCase() : '' } : { tab: 'poker', room: '' };
  }
  function show(tab, room) {
    var f = frames[tab];
    if (!f.getAttribute('src')) f.setAttribute('src', src[tab] + (tab === 'rennen' && room ? '?raum=' + encodeURIComponent(room) : tab === 'minigames' && room ? '#spiel=' + room : ''));
    else if (tab === 'rennen' && room && f.contentWindow) f.contentWindow.postMessage({ gk: 'room', room: room }, '*');
    for (var k in frames) frames[k].classList.toggle('on', k === tab);
    var bs = document.querySelectorAll('.tab');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-t') === tab);
    cur = tab;
    document.title = tab === 'rennen' ? 'Guruhalle Kart – Stammtisch Grand Prix' : tab === 'minigames' ? 'Guruhalle MiniGame Center' : 'Guruhalle Stammtisch – Pokerabend';
    setTimeout(function () { try { f.focus(); f.contentWindow.focus(); } catch (e) {} }, 50);
  }
  function setHash(h) { try { history.replaceState(null, '', location.pathname + location.search + (h ? '#' + h : '')); } catch (e) { location.hash = h; } }
  function go(t) { document.body.classList.remove('race'); setHash(t === 'poker' ? '' : t); show(t, ''); }
  var bs = document.querySelectorAll('.tab');
  for (var i = 0; i < bs.length; i++) bs[i].addEventListener('click', function () { var t = this.getAttribute('data-t'); if (t !== cur) go(t); });
  window.addEventListener('hashchange', function () { var p = parseHash(); show(p.tab, p.room); });

  // ---------- Gemeinsame Geldbörse (localStorage „guru.wallet“, gleicher Ursprung wie alle drei Spiele) ----------
  var WKEY = 'guru.wallet', wal = document.getElementById('wal'), lastCoins = null;
  function readW() { try { return JSON.parse(localStorage.getItem(WKEY) || 'null'); } catch (e) { return null; } }
  function paint() {
    var w = readW(), c = w && typeof w.coins === 'number' ? w.coins : 0;
    wal.textContent = '🪙 ' + Math.round(c).toLocaleString('de-DE');
    if (lastCoins !== null && c > lastCoins) { wal.classList.remove('bump'); void wal.offsetWidth; wal.classList.add('bump'); }
    lastCoins = c;
  }
  // Gutschrift aus Kart oder Poker: postMessage({gk:'earn', cur:'sats'|'chips', n:Zahl, why:'Text'}, '*')
  // Ohne Konto: sofort im Browser gutschreiben. Mit Konto zusätzlich als Operation zum Konto-Server
  // (Warteschlange „guru.queue“, gleiche Form wie im MiniGame Center; der Server deckelt pro Tag und zählt jede Operation nur einmal).
  var QKEY = 'guru.queue', SKEY = 'guru.session', flushing = false;
  function ls(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function credit(curr, n, why) {
    var max = { sats: 500, chips: 100000 }[curr]; if (!max) return;
    n = Math.round(Math.max(0, Math.min(max, +n || 0))); if (!n) return;
    why = String(why || 'Gutschrift').slice(0, 60);
    var w = readW();
    if (!w || w.v !== 1) w = { v: 1, coins: 100, sats: 0, chips: 0, log: [{ t: Date.now(), cur: 'coins', n: 100, why: 'Willkommensbonus 🎁' }] };
    w[curr] = (w[curr] || 0) + n;
    w.log = [{ t: Date.now(), cur: curr, n: n, why: why }].concat(w.log || []).slice(0, 40);
    lsSet(WKEY, w);
    var s = ls(SKEY, null);
    if (s && s.token && s.api) { var q = ls(QKEY, []); q.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), op: 'credit', cur: curr, n: n, why: why }); lsSet(QKEY, q.slice(-200)); flush(); }
    try { frames.minigames.contentWindow && frames.minigames.contentWindow.postMessage({ gk: 'wallet' }, '*'); } catch (e) {}
  }
  function flush() {
    var s = ls(SKEY, null), q = ls(QKEY, []);
    if (flushing || !s || !s.token || !s.api || !q.length) return;
    flushing = true;
    var batch = q.slice(0, 40);
    fetch(s.api, { method: 'POST', body: JSON.stringify({ a: 'ops', token: s.token, ops: batch }), credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (!r || !r.ok || !r.wallet) return;
        var sent = {}; batch.forEach(function (o) { sent[o.id] = 1; });
        var rest = ls(QKEY, []).filter(function (o) { return !sent[o.id]; }); lsSet(QKEY, rest);
        if (!rest.length) { lsSet(WKEY, r.wallet); paint(); } // sonst rechnet das MiniGame Center den Rest drauf
      })
      .catch(function () { /* später nochmal */ })
      .then(function () { flushing = false; });
  }
  setInterval(flush, 30000);
  wal.addEventListener('click', function () { go('minigames'); });
  window.addEventListener('storage', function (e) { if (e.key === WKEY) paint(); });
  setInterval(paint, 4000); paint();

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    var fromRace = e.source === frames.rennen.contentWindow, fromPoker = e.source === frames.poker.contentWindow;
    if (d.gk === 'earn' && (fromRace || fromPoker)) { credit(fromRace ? 'sats' : 'chips', d.n, d.why); paint(); return; }
    if (!fromRace) return;
    if (d.gk === 'race') document.body.classList.toggle('race', !!d.on && cur === 'rennen');
    if (d.gk === 'room' && cur === 'rennen') setHash('rennen' + (d.room && d.room !== 'stammtisch' ? '=' + d.room : ''));
    // Umschalt-Knopf im Spiel (♠ Zum Pokerabend / 🏎️ Kart): Reiter wechseln, Leiste wieder zeigen
    if (d.gk === 'tab' && (d.tab === 'poker' || d.tab === 'rennen' || d.tab === 'minigames')) go(d.tab);
  });
  // Sicherheitsnetz: Esc oder Klick oben am Rand holt die Reiter-Leiste zurück, falls sie im Rennen versteckt blieb
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') document.body.classList.remove('race'); });
  var edge = document.createElement('div'); edge.id = 'edge'; edge.title = 'Reiter einblenden'; document.body.appendChild(edge);
  edge.addEventListener('click', function () { document.body.classList.remove('race'); });
  var p = parseHash(); show(p.tab, p.room);
})();
</script>
</body>
</html>
